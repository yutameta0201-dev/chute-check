<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>在庫カウント（7桁マスタ対応版）</title>

<style>
body { margin:0; font-family:sans-serif; background:#f5f5f5; }

.container {
  display:grid;
  grid-template-rows: 80px 180px 1fr 150px;
  height:100vh;
  gap:10px;
  padding:10px;
}

/* 上 */
.top { display:flex; }
.btnBox {
  flex:1;
  margin:5px;
  border:3px solid black;
  background:white;
  font-size:20px;
  display:flex;
  align-items:center;
  justify-content:center;
}

/* 中央 */
.center {
  border:3px solid black;
  background:white;
  display:flex;
  flex-direction:column;
  padding:10px;
}

.label { font-size:18px; }

#lastItem {
  font-size:32px;
  text-align:center;
}

#itemName {
  font-size:24px;
  text-align:center;
  color:#555;
}

#countDisplay {
  font-size:70px;
  text-align:center;
  font-weight:bold;
  color:green;
}

.list {
  flex:1;
  overflow:auto;
  border-top:2px solid #ccc;
  margin-top:10px;
}

.row {
  display:flex;
  justify-content:space-between;
  padding:5px;
  border-bottom:1px solid #eee;
  font-size:16px;
}

/* 下 */
.bottom { display:flex; }
.btn { flex:1; margin:10px; font-size:24px; }

.minus { background:#ff9800; color:white; }
.clear { background:#f44336; color:white; }
.csv { background:#4CAF50; color:white; }

</style>
</head>

<body tabindex="0">

<div class="container">

  <!-- 上 -->
  <div class="top">
    <div class="btnBox">
      <input type="file" id="masterFile" accept=".csv">
    </div>
  </div>

  <!-- 中央 -->
  <div class="center">
    <div class="label">最新スキャン（8桁）</div>
    <div id="lastItem">---</div>

    <div id="itemName">商品名未登録</div>

    <div class="label">数量</div>
    <div id="countDisplay">0</div>

    <div class="list" id="list"></div>
  </div>

  <!-- 下 -->
  <div class="bottom">
    <button class="btn minus" onclick="minusOne()">−1</button>
    <button class="btn clear" onclick="clearAll()">全クリア</button>
    <button class="btn csv" onclick="downloadCSV()">CSV出力</button>
  </div>

</div>

<script>

let buffer = "";
let stockData = {};
let lastCode = "";
let master = {};

/* ★ 末尾1桁カット（7桁にする） */
function getCompareCode(code){
  return code.slice(0, -1);
}

/* マスタ読込 */
document.getElementById("masterFile").addEventListener("change", function(e){
  let file = e.target.files[0];
  let reader = new FileReader();

  reader.onload = function(){
    let lines = reader.result.split("\n");

    lines.forEach((line,i)=>{
      if(i === 0) return;
      let cols = line.split(",");
      if(cols.length >= 2){
        master[cols[0].trim()] = cols[1].trim();
      }
    });

    alert("マスタ読込完了");
  };

  reader.readAsText(file);
});

/* スキャナ入力 */
document.body.focus();

document.addEventListener("keydown", e=>{
  if(e.key === "Enter"){
    if(buffer){
      processScan(buffer);
    }
    buffer = "";
  }else{
    buffer += e.key;
  }
});

/* スキャン処理 */
function processScan(code){
  lastCode = code;

  if(!stockData[code]){
    stockData[code] = 0;
  }
  stockData[code]++;

  updateDisplay(code);
  beep();
}

/* 表示更新 */
function updateDisplay(code){

  let compareCode = getCompareCode(code);

  document.getElementById("lastItem").innerText = code;
  document.getElementById("countDisplay").innerText = stockData[code];

  let name = master[compareCode] || "未登録商品";
  let nameEl = document.getElementById("itemName");

  nameEl.innerText = name;

  /* 未登録は赤 */
  if(!master[compareCode]){
    nameEl.style.color = "red";
  }else{
    nameEl.style.color = "#555";
  }

  let list = document.getElementById("list");
  list.innerHTML = "";

  for(let key in stockData){
    let cmp = getCompareCode(key);
    let itemName = master[cmp] || "未登録";

    let row = document.createElement("div");
    row.className = "row";
    row.innerHTML = `<div>${key} ${itemName}</div><div>${stockData[key]}</div>`;
    list.appendChild(row);
  }
}

/* −1 */
function minusOne(){
  if(lastCode && stockData[lastCode]){
    stockData[lastCode]--;
    if(stockData[lastCode] <= 0){
      delete stockData[lastCode];
    }
    updateDisplay(lastCode);
  }
}

/* 全クリア */
function clearAll(){
  if(confirm("全削除しますか？")){
    stockData = {};
    lastCode = "";
    document.getElementById("lastItem").innerText = "---";
    document.getElementById("itemName").innerText = "";
    document.getElementById("countDisplay").innerText = "0";
    document.getElementById("list").innerHTML = "";
  }
}

/* CSV */
function downloadCSV(){
  let csv = "商品コード(8桁),商品名,数量\n";

  for(let key in stockData){
    let cmp = getCompareCode(key);
    let name = master[cmp] || "";

    csv += `${key},${name},${stockData[key]}\n`;
  }

  let blob = new Blob([csv], {type:"text/csv"});
  let a = document.createElement("a");
  let date = new Date().toISOString().slice(0,10);
  a.href = URL.createObjectURL(blob);
  a.download = "stock_" + date + ".csv";
  a.click();
}

/* 音 */
function beep(){
  let ctx = new (window.AudioContext || window.webkitAudioContext)();
  let osc = ctx.createOscillator();
  osc.frequency.value = 800;
  osc.connect(ctx.destination);
  osc.start();
  osc.stop(ctx.currentTime + 0.1);
}

</script>

</body>
</html>
