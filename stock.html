<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>在庫カウント（見やすさ強化版）</title>

<style>
body { margin:0; font-family:sans-serif; background:#f5f5f5; }

.container {
  display:grid;
  grid-template-rows: 70px 1fr 100px;
  height:100vh;
  gap:10px;
  padding:10px;
}

/* 上（マスタ） */
.top {
  display:flex;
  align-items:center;
  justify-content:center;
}

/* 中央（メイン表示） */
.center {
  border:3px solid black;
  background:white;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
}

/* スキャンコード */
#lastItem {
  font-size:28px;
  margin-bottom:10px;
}

/* 商品名（デカ） */
#itemName {
  font-size:48px;
  font-weight:bold;
  text-align:center;
  margin-bottom:20px;
}

/* 数量（超デカ） */
#countDisplay {
  font-size:120px;
  font-weight:bold;
  color:green;
}

/* 下（ボタン小さく） */
.bottom {
  display:flex;
}

.btn {
  flex:1;
  margin:5px;
  font-size:18px;
  padding:10px;
}

.minus { background:#ff9800; color:white; }
.clear { background:#f44336; color:white; }
.csv { background:#4CAF50; color:white; }

</style>
</head>

<body tabindex="0">

<div class="container">

  <!-- 上 -->
  <div class="top">
    <input type="file" id="masterFile" accept=".csv">
  </div>

  <!-- 中央 -->
  <div class="center">
    <div id="lastItem">---</div>
    <div id="itemName">商品名未登録</div>
    <div id="countDisplay">0</div>
  </div>

  <!-- 下 -->
  <div class="bottom">
    <button class="btn minus" onclick="minusOne()">−1</button>
    <button class="btn clear" onclick="clearAll()">クリア</button>
    <button class="btn csv" onclick="downloadCSV()">CSV</button>
  </div>

</div>

<script>

let buffer = "";
let stockData = {};
let lastCode = "";
let master = {};

/* 7桁比較 */
function getCompareCode(code){
  return code.slice(0, -1);
}

/* マスタ読込 */
document.getElementById("masterFile").addEventListener("change", function(e){
  let file = e.target.files[0];
  let reader = new FileReader();

  reader.onload = function(){
    let lines = reader.result.split("\n");

    lines.forEach((line,i)=>{
      if(i === 0) return;
      let cols = line.split(",");
      if(cols.length >= 2){
        master[cols[0].trim()] = cols[1].trim();
      }
    });

    alert("マスタ読込完了");
  };

  reader.readAsText(file);
});

/* スキャナ */
document.body.focus();

document.addEventListener("keydown", e=>{
  if(e.key === "Enter"){
    if(buffer){
      processScan(buffer);
    }
    buffer = "";
  }else{
    buffer += e.key;
  }
});

/* スキャン処理 */
function processScan(code){
  lastCode = code;

  if(!stockData[code]){
    stockData[code] = 0;
  }
  stockData[code]++;

  updateDisplay(code);
  beep();
}

/* 表示 */
function updateDisplay(code){

  let cmp = getCompareCode(code);

  document.getElementById("lastItem").innerText = code;
  document.getElementById("countDisplay").innerText = stockData[code];

  let name = master[cmp] || "未登録商品";
  let nameEl = document.getElementById("itemName");

  nameEl.innerText = name;

  if(!master[cmp]){
    nameEl.style.color = "red";
  }else{
    nameEl.style.color = "black";
  }
}

/* −1 */
function minusOne(){
  if(lastCode && stockData[lastCode]){
    stockData[lastCode]--;
    if(stockData[lastCode] <= 0){
      delete stockData[lastCode];
      document.getElementById("countDisplay").innerText = "0";
    }else{
      document.getElementById("countDisplay").innerText = stockData[lastCode];
    }
  }
}

/* クリア */
function clearAll(){
  if(confirm("削除しますか？")){
    stockData = {};
    lastCode = "";
    document.getElementById("lastItem").innerText = "---";
    document.getElementById("itemName").innerText = "";
    document.getElementById("countDisplay").innerText = "0";
  }
}

/* CSV */
function downloadCSV(){
  let csv = "商品コード,商品名,数量\n";

  for(let key in stockData){
    let cmp = getCompareCode(key);
    let name = master[cmp] || "";
    csv += `${key},${name},${stockData[key]}\n`;
  }

  let blob = new Blob([csv], {type:"text/csv"});
  let a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "stock.csv";
  a.click();
}

/* 音 */
function beep(){
  let ctx = new (window.AudioContext || window.webkitAudioContext)();
  let osc = ctx.createOscillator();
  osc.frequency.value = 800;
  osc.connect(ctx.destination);
  osc.start();
  osc.stop(ctx.currentTime + 0.1);
}

</script>

</body>
</html>
