<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>検品アプリ（完成版）</title>

<style>
body { margin:0; font-family:sans-serif; background:#f5f5f5; }

.container {
    display:grid;
    grid-template-rows: 120px auto auto 1fr 180px;
    height:100vh;
    gap:10px;
    padding:10px;
}

/* 上ボタン */
.top {
    display:flex;
}

.btnBox {
    flex:1;
    margin:5px;
    border:3px solid black;
    background:white;
    font-size:36px;
    display:flex;
    align-items:center;
    justify-content:center;
}

/* バッチ（巨大化） */
.batch-area {
    border:3px solid black;
    background:yellow;
    padding:10px;
}

#batchBig {
    font-size:110px;  /* ←巨大化 */
    text-align:center;
    font-weight:bold;
}

/* 作業開始ボタン（超大） */
#startBtn {
    width:100%;
    font-size:60px;
    padding:20px;
    background:#ff9800;
    color:white;
    border:none;
    border-radius:10px;
}

/* 中央 */
.center {
    border:3px solid black;
    background:white;
    display:flex;
    flex-direction:column;
}

.label {
    font-size:20px;
}

/* シュート（少し小さく） */
#chuteDisplay {
    flex:1;
    font-size:100px; /* ←少し縮小 */
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:bold;
}

.ok { color:green; }
.ng { color:red; }

/* 下 */
.bottom {
    display:flex;
}

.btn {
    flex:1;
    margin:10px;
    font-size:36px;
}

.complete { background:#2196F3; color:white; }
.csv { background:#4CAF50; color:white; }

</style>
</head>

<body tabindex="0">

<div class="container">

    <!-- 上 -->
    <div class="top">
        <div class="btnBox" onclick="mode='batch'">検品バッチ</div>
        <div class="btnBox" onclick="mode='start'">開始シュート指定</div>
    </div>

    <!-- バッチ -->
    <div class="batch-area">
        <div>バッチNO</div>
        <div id="batchBig">---</div>
    </div>

    <!-- 作業開始 -->
    <button id="startBtn" onclick="startWork()">作業開始</button>

    <!-- 中央 -->
    <div class="center">
        <div class="label">確認シュート</div>
        <div id="chuteDisplay">---</div>
    </div>

    <!-- 下 -->
    <div class="bottom">
        <button class="btn complete" onclick="completeBatch()">完了 → 次へ</button>
        <button class="btn csv" onclick="downloadCSV()">CSV出力</button>
    </div>

</div>

<script>
let mode = "";
let isWorking = false;

let workCode = "";
let currentChute = 1;
let buffer = "";

let csvData = [];

/* 入力 */
document.body.focus();

document.addEventListener("keydown", e=>{

    if(e.key==="Enter"){

        if(mode === "batch"){
            workCode = buffer;
            updateBatch();
            mode="";
        }
        else if(mode === "start"){
            currentChute = parseInt(buffer,10);
            updateChute();
            mode="";
        }
        else if(isWorking){
            processResult(buffer);
        }

        buffer="";

    }else{
        buffer += e.key;
    }
});

/* 作業開始 */
function startWork(){

    if(!workCode){
        alert("バッチ未設定");
        return;
    }

    isWorking = true;
    updateChute();

    document.body.style.background="#e8f5e9"; // 薄緑
}

/* 判定 */
function processResult(data){

    let expected = workCode + "/" + pad(currentChute);

    if(data === expected){

        currentChute++;
        updateChute("ok");
        addLog("OK", data);

    }else{

        updateChute("ng");
        speakNG();
        addLog("NG", data);

        document.body.style.background="red";
        setTimeout(()=>document.body.style.background="#e8f5e9",300);
    }
}

/* 完了 */
function completeBatch(){

    let num = parseInt(workCode,10);
    num++;

    workCode = num.toString().padStart(8,"0");
    currentChute = 1;
    isWorking = false;

    updateBatch();
    updateChute();

    document.body.style.background="#f5f5f5";
}

/* 表示 */
function updateBatch(){
    document.getElementById("batchBig").innerText = workCode;
}

function updateChute(state){
    let el = document.getElementById("chuteDisplay");
    el.innerText = pad(currentChute);
    el.className = state || "";
}

/* CSV */
function addLog(type,data){
    let time = new Date().toLocaleTimeString();
    csvData.push({time,batch:workCode,result:type,value:data});
}

function downloadCSV(){
    let csv="時間,バッチ,結果,読取値\n";
    csvData.forEach(r=>{
        csv+=`${r.time},${r.batch},${r.result},${r.value}\n`;
    });

    let blob=new Blob([csv],{type:"text/csv"});
    let a=document.createElement("a");
    a.href=URL.createObjectURL(blob);
    a.download="log.csv";
    a.click();
}

/* 音声 */
function speakNG(){
    let u=new SpeechSynthesisUtterance("違います");
    u.lang="ja-JP";
    speechSynthesis.speak(u);
}

function pad(n){
    return n.toString().padStart(3,"0");
}
</script>

</body>
</html>
