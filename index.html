<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>QR連番チェック</title>

<script src="https://cdn.jsdelivr.net/npm/jsqr/dist/jsQR.js"></script>

<style>
body { font-family:sans-serif; text-align:center; margin:0; }
video { width:90%; max-width:400px; border:2px solid black; }

.big {
    font-size:30px;
    padding:20px 50px;
    margin:10px;
}

#result { font-size:28px; font-weight:bold; }

.red { color:red; }
.green { color:green; }

.flash { animation: flash 0.8s; }
@keyframes flash {
0%{background:white;}
25%{background:red;}
50%{background:white;}
75%{background:red;}
100%{background:white;}
}
</style>
</head>

<body>

<h2>QR連番チェック</h2>

<button onclick="readWork()">作業QR読み取り</button><br>

開始シュート:
<input type="number" id="startChute" value="1"><br>

<button class="big" onclick="scanQR()">読み取り</button>

<video id="video" autoplay playsinline></video>

<p id="result"></p>

<audio id="okSound">
<source src="https://actions.google.com/sounds/v1/alarms/beep_short.ogg">
</audio>

<script>
let video = document.getElementById("video");
let workCode = null;
let currentChute = 1;
let isProcessing = false;

// カメラ起動
navigator.mediaDevices.getUserMedia({
    video:{ facingMode:"environment" }
}).then(stream=>video.srcObject=stream);

// 作業QR読み取り
function readWork(){
    captureQR((data)=>{
        if(!data.includes("/")){
            workCode = data;
            document.getElementById("result").innerHTML =
                "作業番号: " + workCode;
        }else{
            alert("作業QRを読み取ってください");
        }
    });
}

// 通常スキャン
function scanQR(){

    if(!workCode){
        alert("先に作業QRを読み取ってください");
        return;
    }

    currentChute = parseInt(document.getElementById("startChute").value);

    captureQR((data)=>{

        let expected = workCode + "/" + pad(currentChute);

        if(data === expected){

            document.getElementById("result").innerHTML =
                "OK ✔ " + data;
            document.getElementById("result").className="green";

            document.getElementById("okSound").play();

            currentChute++;

        }else{

            document.getElementById("result").innerHTML =
                "NG ✖ " + data + "<br>次: " + expected;
            document.getElementById("result").className="red";

            speakNG();

            document.body.classList.add("flash");
            setTimeout(()=>document.body.classList.remove("flash"),800);

            navigator.vibrate?.([200,100,200]);
        }
    });
}

// QR読み取り共通
function captureQR(callback){

    if(isProcessing) return;
    isProcessing = true;

    let canvas = document.createElement("canvas");
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    let ctx = canvas.getContext("2d");

    ctx.drawImage(video,0,0);

    let imageData = ctx.getImageData(0,0,canvas.width,canvas.height);

    let code = jsQR(imageData.data, canvas.width, canvas.height);

    if(code){
        callback(code.data);
    }else{
        document.getElementById("result").innerHTML="QRなし";
    }

    isProcessing = false;
}

// ゼロ埋め
function pad(num){
    return num.toString().padStart(3,"0");
}

// 音声（iPhone対策）
function speakNG(){
    let u = new SpeechSynthesisUtterance("違います");
    u.lang="ja-JP";
    speechSynthesis.speak(u);
}
</script>

</body>
</html>
