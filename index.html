<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>QR連番チェック 完全版</title>

<style>
body { font-family:sans-serif; text-align:center; margin:0; }

h2 { font-size:28px; }

/* バッチ表示 */
#batchDisplay {
    font-size:50px;
    font-weight:bold;
    margin:10px;
}

/* カウント */
#counter {
    font-size:24px;
    margin:10px;
}

/* シュート表示（超重要） */
#chuteDisplay {
    font-size:120px;
    font-weight:bold;
}

.ok { color:green; }
.ng { color:red; }

/* ボタン */
button {
    font-size:30px;
    padding:15px 40px;
    margin:10px;
    border:none;
    border-radius:10px;
}

/* 完了ボタン */
#completeBtn {
    background:#2196F3;
    color:white;
}

/* CSVボタン */
#csvBtn {
    background:#4CAF50;
    color:white;
}

/* ログ */
#log {
    max-height:150px;
    overflow:auto;
    border-top:2px solid #ccc;
    margin-top:10px;
    font-size:16px;
    text-align:left;
    padding:5px;
}

/* NG演出 */
.flash { animation: flash 0.6s; }
@keyframes flash {
0%{background:white;}
25%{background:red;}
50%{background:white;}
75%{background:red;}
100%{background:white;}
}
</style>
</head>

<body tabindex="0">

<h2>QR連番チェック</h2>

<div id="batchDisplay">---</div>

<div id="counter">
OK: <span id="okCount">0</span> /
NG: <span id="ngCount">0</span>
</div>

<div id="chuteDisplay">---</div>

<button id="completeBtn" onclick="completeBatch()">完了 → 次へ</button>
<button id="csvBtn" onclick="downloadCSV()">CSVダウンロード</button>

<div id="log"></div>

<script>
let workCode = "";
let currentChute = 1;
let lastRead = "";
let buffer = "";

let okCount = 0;
let ngCount = 0;

let csvData = [];

/* 🔴 フォーカス確保（スキャナ用） */
document.body.focus();

/* 🔴 スキャナ入力 */
document.addEventListener("keydown", e=>{

    if(e.key==="Enter"){

        if(!workCode){
            workCode = buffer;
            updateBatch();
            buffer="";
            return;
        }

        processResult(buffer);
        buffer="";

    }else{
        buffer += e.key;
    }
});

/* 🔴 判定 */
function processResult(data){

    if(data === lastRead) return;
    lastRead = data;

    let expected = workCode + "/" + pad(currentChute);

    if(data === expected){

        okCount++;
        document.getElementById("okCount").innerText = okCount;

        currentChute++;
        updateChute("ok");

        addLog("OK", data);

    }else{

        ngCount++;
        document.getElementById("ngCount").innerText = ngCount;

        addLog("NG", data);

        speakNG();

        document.body.classList.add("flash");
        setTimeout(()=>document.body.classList.remove("flash"),600);

        navigator.vibrate?.([200,100,200]);

        updateChute("ng");
    }
}

/* 🔴 完了 → 次バッチ */
function completeBatch(){

    if(!workCode) return;

    let num = parseInt(workCode,10);
    num++;

    workCode = num.toString().padStart(8,"0");

    currentChute = 1;
    okCount = 0;
    ngCount = 0;

    document.getElementById("okCount").innerText = 0;
    document.getElementById("ngCount").innerText = 0;

    updateBatch();
    updateChute();
}

/* 表示更新 */
function updateBatch(){
    document.getElementById("batchDisplay").innerText = workCode;
}

function updateChute(state){
    let el = document.getElementById("chuteDisplay");
    el.innerText = pad(currentChute);
    el.className = state || "";
}

/* 🔴 ログ＋CSV保存 */
function addLog(type,data){

    let time = new Date().toLocaleTimeString();

    // 画面ログ
    let log = document.getElementById("log");
    log.innerHTML = "["+time+"] "+type+" : "+data+"<br>" + log.innerHTML;

    // CSVデータ
    csvData.push({
        time: time,
        batch: workCode,
        result: type,
        value: data
    });
}

/* 🔴 CSVダウンロード */
function downloadCSV(){

    if(csvData.length === 0){
        alert("データなし");
        return;
    }

    let csv = "時間,バッチ,結果,読取値\n";

    csvData.forEach(row=>{
        csv += `${row.time},${row.batch},${row.result},${row.value}\n`;
    });

    let blob = new Blob([csv], { type: "text/csv" });

    let link = document.createElement("a");
    link.href = URL.createObjectURL(blob);

    let date = new Date().toISOString().slice(0,10);
    link.download = "log_" + date + ".csv";

    link.click();
}

/* 🔴 NG音声 */
function speakNG(){
    let u = new SpeechSynthesisUtterance("違います");
    u.lang="ja-JP";
    speechSynthesis.speak(u);
}

/* 桁揃え */
function pad(num){
    return num.toString().padStart(3,"0");
}
</script>

</body>
</html>
