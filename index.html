<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>検品アプリ（音声改善版）</title>

    <link rel="manifest" href="manifest.json">
    
<style>
body {
    margin:0;
    font-family:sans-serif;
    background:#f5f5f5;
}

.container {
    display:grid;
    grid-template-rows: 100px 160px 140px auto auto 1fr 160px;
    height:100vh;
    gap:10px;
    padding:10px;
}

.top {
    display:flex;
}

.btnBox {
    flex:1;
    margin:5px;
    border:3px solid black;
    background:white;
    font-size:36px;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    box-shadow:0 6px 0 rgba(0,0,0,0.3);
    user-select:none;
}

.btnBox:active {
    transform:translateY(4px);
    box-shadow:0 2px 0 rgba(0,0,0,0.3);
}

.activeMode {
    background:#4CAF50 !important;
    color:white;
}

.asc {
    background:#b3e5fc !important;
}

.desc {
    background:#f8bbd0 !important;
}

.batch-area {
    border:3px solid black;
    background:yellow;
    padding:10px;
}

#batchBig {
    font-size:100px;
    text-align:center;
    font-weight:bold;
}

.worker-area{
    border:3px solid black;
    background:#fff3cd;
    display:flex;
    align-items:center;
    padding:10px 20px;
    gap:20px;
}

.worker-label{
    font-size:32px;
    font-weight:bold;
}

#workerName{
    flex:1;
    font-size:48px;
    font-weight:bold;
}

#startBtn {
    width:100%;
    ...
}

#startBtn {
    width:100%;
    font-size:60px;
    padding:20px;
    background:#ff9800;
    color:white;
    border:none;
    border-radius:10px;
}

.center {
    border:3px solid black;
    background:white;
    display:flex;
    flex-direction:column;
}

#chuteDisplay {
    flex:1;
    font-size:16vw;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:bold;
}

.ok {
    color:green;
}

.ng {
    color:red;
}

.bottom {
    display:flex;
}

.btn {
    flex:1;
    margin:10px;
    font-size:32px;
}

.complete {
    background:#2196F3;
    color:white;
}

.csv {
    background:#4CAF50;
    color:white;
}
.clear {
    background:#f44336;
    color:white;
}
    
</style>
</head>

<body tabindex="0">

<div class="container">

    <div class="worker-area"
         onclick="setMode('worker')">

        <div class="worker-label">作業者</div>

        <div id="workerName">QRを読込</div>

    </div>

    <div class="top">

        <div class="btnBox"
             id="batchBtn"
             onclick="setMode('batch')">
            バッチ
        </div>

        <div class="btnBox"
             id="startBtnTop"
             onclick="setMode('start')">
            開始シュート
        </div>

        <div class="btnBox asc"
             id="orderBtn"
             onclick="toggleOrder()">
            昇順
        </div>

    </div>

    <div class="top">

        <div class="btnBox activeMode"
             id="m1"
             onclick="setMachine(1)">
            1・2号機
        </div>

        <div class="btnBox"
             id="m3"
             onclick="setMachine(3)">
            3号機
        </div>

    </div>

    <div class="batch-area">
        <div>バッチNO</div>
        <div id="batchBig">---</div>
    </div>

   <button id="startBtn"
        onclick="startWork()">
    作業開始
</button>

<div class="center">
    <div>確認シュート</div>
    <div id="chuteDisplay">---</div>
</div>

<div class="bottom">

    <button class="btn complete"
            onclick="completeBatch()">
        完了 → 次へ
    </button>

    <button class="btn csv"
            onclick="downloadCSV()">
        CSV出力
    </button>

    <button class="btn clear"
            onclick="clearData()">
        データ削除
    </button>

</div>
    
<script>

let mode="";
let isWorking=false;

let workCode="";
let workerName="";
let currentChute=1;
    
const workers = {
    "a001": {
        name: "中嶋康友",
        voice: "なかじま やすとも"
    },
    "a002": {
        name: "飯田直樹",
        voice: "いいだ なおき"
    },
    "a003": {
        name: "内藤敦",
        voice: "ないとう あつし"
    }
};
    
let startChute=1;
let buffer="";

let orderMode="asc";
let machineType=1;

let csvData = JSON.parse(localStorage.getItem("csvData")) || [];

let speaking=false;

/* =========================
   音声
========================= */
function speak(text){

    try{

        speechSynthesis.cancel(); 
        let u = new SpeechSynthesisUtterance(text); 
        u.lang="ja-JP"; 
        let voices=speechSynthesis.getVoices();
        let jaVoice=voices.find(v=>v.lang.includes("ja")); 
        if(jaVoice){ u.voice=jaVoice; }
        
        u.rate=1.15;
        u.pitch=1;
        u.volume=1;

        speaking=true;

        u.onend=()=>{
            speaking=false;
        };

        speechSynthesis.speak(u);

    }catch(e){
        console.log(e);
    }
}

/* =========================
   長押し設定
========================= */
function setupLongPress(id,type){

    let timer=null;

    const el=document.getElementById(id);

    const start=()=>{

        timer=setTimeout(()=>{

            if(type==="batch"){

                let val=prompt("開始バッチを入力してください",workCode);

                if(val!==null){

                    val=val.replace(/\D/g,'');

                    if(val){

                        workCode=val.padStart(8,"0");

                        updateBatch();

                        mode="";
                        buffer="";

                        speak("開始バッチを設定しました");

                        setTimeout(()=>{
                            document.body.focus();},100);
                    }
                }
            }

            if(type==="start"){

                let val=prompt("開始シュートを入力してください",startChute);

                if(val!==null){

                    val=val.replace(/\D/g,'');

                    if(val){

                        startChute=parseInt(val,10);

                        currentChute=startChute;

                        updateChute();
                        mode="";
                        buffer="";

                        speak(startChute + "から開始します");
                        setTimeout(()=>{
                         document.body.focus();
                        },100);
                    }
                }
            }

        },800);
    };

    const cancel=()=>{

        clearTimeout(timer);
    };

    el.addEventListener("mousedown",start);
    el.addEventListener("touchstart",start);

    el.addEventListener("mouseup",cancel);
    el.addEventListener("mouseleave",cancel);
    el.addEventListener("touchend",cancel);
}

setupLongPress("batchBtn","batch");
setupLongPress("startBtnTop","start");

/* =========================
   モード
========================= */
function setMode(m){

    mode=m;

    document.getElementById("batchBtn")
        .classList.remove("activeMode");

    document.getElementById("startBtnTop")
        .classList.remove("activeMode");

    if(m==="batch"){

        document.getElementById("batchBtn")
            .classList.add("activeMode");

        speak("開始バッチのキューアールコードを読み込んでください");
    }

    if(m==="start"){

        document.getElementById("startBtnTop")
            .classList.add("activeMode");

        speak("検品を始めるシュートのキューアールコードを読み込んでください");
    }
    if(m==="worker"){

    speak("作業者のキューアールコードを読み込んでください");
}
}

/* =========================
   昇順降順
========================= */
function toggleOrder(){

    let btn=document.getElementById("orderBtn");

    btn.classList.remove("asc","desc");

    if(orderMode==="asc"){

        orderMode="desc";

        btn.innerText="降順";

        btn.classList.add("desc");

        speak("降順モードです");

    }else{

        orderMode="asc";

        btn.innerText="昇順";

        btn.classList.add("asc");

        speak("昇順モードです");
    }
}

/* =========================
   号機
========================= */
function setMachine(m){

    machineType=m;

    document.getElementById("m1")
        .classList.remove("activeMode");

    document.getElementById("m3")
        .classList.remove("activeMode");

    if(m===1){

        document.getElementById("m1")
            .classList.add("activeMode");

    }else{

        document.getElementById("m3")
            .classList.add("activeMode");
    }

    speak(m + "号機モードです");
}

/* =========================
   最大最小
========================= */
function getMaxChute(){

    if(machineType===1){
        return (startChute<=18)?18:36;
    }

    if(machineType===3){
        return (startChute<=20)?20:36;
    }

    return 36;
}

function getMinChute(){

    if(machineType===1){
        return (startChute<=18)?1:19;
    }

    if(machineType===3){
        return (startChute<=20)?1:21;
    }

    return 1;
}

/* =========================
   次シュート
========================= */
function nextChute(){

    if(orderMode==="asc"){

        currentChute++;

    }else{

        currentChute--;
    }
}

/* =========================
   キーボード入力
========================= */
document.body.focus();

document.addEventListener("keydown", e=>{

    if(e.key==="Enter"){

       if(mode==="worker"){

    const code = buffer.trim();

const worker = workers[code];

if(worker){

    workerName = worker.name;

    document.getElementById("workerName").innerText = worker.name;

    speak(worker.voice + "さんです");

}else{

    workerName = "未登録";

    document.getElementById("workerName").innerText = workerName;

    speak("みとうろくです");
}
else if(mode==="batch"){

    let b = buffer.replace(/\D/g,'');

    workCode=b.padStart(8,"0");

    updateBatch();

    speak("バッチ番号 " + workCode.split('').join(' ') + " を登録しました");
}

        else if(mode==="start"){

            let s = buffer.match(/\d+/);

            if(s){

                currentChute=parseInt(s[0],10);

                startChute=currentChute;

                updateChute();

                speak(currentChute + "から開始します");
            }
        }

        else if(isWorking){

            processResult(buffer);
        }

        buffer="";
        mode="";

        document.body.focus();
    }
    else{

        buffer+=e.key;
    }
});

/* =========================
   作業開始
========================= */
function startWork(){
    
    mode="";
    buffer="";
    
    if(!workCode){

        alert("バッチ未設定");

        speak("バッチが未設定です");

        return;
    }

    if(!confirm("開始しますか？")) return;

    isWorking=true;

    if(orderMode==="desc"){

        currentChute=getMaxChute();

    }else{

        currentChute=startChute;
    }

    updateChute();

    speak(currentChute + "です");
}

/* =========================
   判定
========================= */
function processResult(data){

if(data==="9999/999"){

        addLog("キャンセル","シュート"+currentChute);

        speak("キャンセルします");

        nextChute();

        updateChute();

        return;
    }
　　
    let clean = data.trim();

    let match = clean.match(/^(\d+)\/(\d{3})/);

    if(!match){

        updateChute("ng");

        addLog("NG",data);

        speak("QRコードエラーです");

        return;
    }

    let scanBatch = match[1].padStart(8,"0");

    let scanChute = match[2];

    let expectedBatch = workCode.padStart(8,"0");

    let expectedChute = pad(currentChute);

    if(scanBatch !== expectedBatch){

        updateChute("ng");

        addLog("NG",data);

        speak("バッチが違います");

        return;
    }

    if(scanChute !== expectedChute){

        updateChute("ng");

        addLog("NG",data);

        speak("シュートが違います");

        return;
    }

    let max=getMaxChute();

    let min=getMinChute();

    let isLast=(orderMode==="asc")
        ? currentChute===max
        : currentChute===min;

    if(isLast){

        speak("全シュート完了です");

        nextChute();

    }else{

        nextChute();

        speak(currentChute + "です");
    }

    updateChute("ok");

    addLog("OK",data);
}

/* =========================
   完了
========================= */
function completeBatch(){

　　 mode="";
    buffer="";
    
    let max=getMaxChute();

    let min=getMinChute();

    let finished=(orderMode==="asc")
        ? currentChute>max
        : currentChute<min;

    if(!finished){

        if(!confirm("最終シュートまで確認していません。次に進みますか？")) return;
    }

    let num=parseInt(workCode,10)+1;

    workCode=num.toString().padStart(8,"0");

    currentChute=startChute;

    isWorking=false;

    updateBatch();

    updateChute();

    speak("次のバッチへ進みます");
}

/* =========================
   表示更新
========================= */
function updateBatch(){

    document.getElementById("batchBig")
        .innerText=workCode;
}

function updateChute(state){

    let el=document.getElementById("chuteDisplay");

    el.innerText=pad(currentChute);

    el.className=state || "";
}

/* =========================
   CSV
========================= */
function downloadCSV(){

    if(csvData.length===0){

        alert("データなし");

        speak("データがありません");

        return;
    }

  let csv = "時間,作業者,バッチ,結果,内容\n";

csvData.forEach(r => {

    csv += `${r.time},${r.worker},${r.batch},${r.result},${r.value}\n`;
});

    let bom="\uFEFF";

    let blob=new Blob(
        [bom + csv],
        {type:"text/csv;charset=utf-8;"}
    );

    let a=document.createElement("a");

    a.href=URL.createObjectURL(blob);

    a.download="log.csv";

    a.click();

    speak("シーエスブイを出力しました");
}
function clearData(){

    if(!confirm("保存データを削除しますか？")) return;

    csvData = [];

    localStorage.removeItem("csvData");

    speak("データを削除しました");

    alert("データを削除しました");
}

/* =========================
   ログ
========================= */
function addLog(type,data){

    let time = new Date().toLocaleTimeString();

    csvData.push({
    time,
    worker: workerName,
    batch: workCode,
    result: type,
    value: data
});

    localStorage.setItem(
        "csvData",
        JSON.stringify(csvData)
    );
}
/* =========================
   ゼロ埋め
========================= */
function pad(n){

    return n.toString().padStart(3,"0");
}

</script>

<script>
if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./service-worker.js')
        .then(() => console.log('Service Worker登録成功'))
        .catch(err => console.error(err));
}
</script>

</body>
</html>
