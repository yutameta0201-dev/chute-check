```html
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>検品アプリ（最終完成版）</title>

<style>
body { margin:0; font-family:sans-serif; background:#f5f5f5; }

.container {
    display:grid;
    grid-template-rows: 120px auto auto auto 1fr 180px;
    height:100vh;
    gap:10px;
    padding:10px;
}

.top { display:flex; }

.btnBox {
    flex:1;
    margin:5px;
    border:3px solid black;
    background:white;
    font-size:26px;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    box-shadow: 0 6px 0 rgba(0,0,0,0.3);
}

.btnBox:active {
    transform: translateY(4px);
    box-shadow: 0 2px 0 rgba(0,0,0,0.3);
}

.activeMode {
    background:#4CAF50 !important;
    color:white;
}

.batch-area {
    border:3px solid black;
    background:yellow;
    padding:10px;
}

#batchBig {
    font-size:90px;
    text-align:center;
    font-weight:bold;
}

#startBtn {
    width:100%;
    font-size:50px;
    padding:20px;
    background:#ff9800;
    color:white;
    border:none;
    border-radius:10px;
}

.center {
    border:3px solid black;
    background:white;
    display:flex;
    flex-direction:column;
}

#chuteDisplay {
    flex:1;
    font-size:20vw;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:bold;
}

.ok { color:green; }
.ng { color:red; }

.bottom { display:flex; }

.btn {
    flex:1;
    margin:10px;
    font-size:30px;
}

.complete { background:#2196F3; color:white; }
.csv { background:#4CAF50; color:white; }
</style>
</head>

<body tabindex="0">

<div class="container">

    <!-- モード -->
    <div class="top">
        <div class="btnBox" onclick="setMode('batch')">バッチ</div>
        <div class="btnBox" onclick="setMode('start')">開始シュート</div>
        <div class="btnBox" id="orderBtn" onclick="toggleOrder()">昇順</div>
    </div>

    <!-- 号機切替 -->
    <div class="top">
        <div class="btnBox" id="m1" onclick="setMachine(1)">1・2号機</div>
        <div class="btnBox" id="m3" onclick="setMachine(3)">3号機</div>
    </div>

    <div class="batch-area">
        <div>バッチNO</div>
        <div id="batchBig">---</div>
    </div>

    <button id="startBtn" onclick="startWork()">作業開始</button>

    <div class="center">
        <div>確認シュート</div>
        <div id="chuteDisplay">---</div>
    </div>

    <div class="bottom">
        <button class="btn complete" onclick="completeBatch()">完了 → 次へ</button>
        <button class="btn csv" onclick="downloadCSV()">CSV出力</button>
    </div>

</div>

<script>
let mode="";
let isWorking=false;

let workCode="";
let currentChute=1;
let buffer="";

let orderMode="asc";
let machineType=1;

let csvData=[];

/* ===== 音声 ===== */
function speak(text){
    speechSynthesis.cancel();
    let u=new SpeechSynthesisUtterance(text);
    u.lang="ja-JP";
    speechSynthesis.speak(u);
}

/* ===== モード ===== */
function setMode(m){ mode=m; }

/* ===== 昇順降順 ===== */
function toggleOrder(){
    if(orderMode==="asc"){
        orderMode="desc";
        document.getElementById("orderBtn").innerText="降順";
    }else{
        orderMode="asc";
        document.getElementById("orderBtn").innerText="昇順";
    }
}

/* ===== 号機切替（ボタン色も変わる） ===== */
function setMachine(m){
    machineType=m;

    document.getElementById("m1").classList.remove("activeMode");
    document.getElementById("m3").classList.remove("activeMode");

    if(m===1){
        document.getElementById("m1").classList.add("activeMode");
    }else{
        document.getElementById("m3").classList.add("activeMode");
    }

    speak(m + "号機モード");
}

/* ===== 最大シュート ===== */
function getMaxChute(){
    if(machineType===1){
        return (currentChute<=18)?18:36;
    }
    if(machineType===3){
        return (currentChute<=20)?20:36;
    }
    return 36;
}

/* ===== 次シュート ===== */
function nextChute(){
    if(orderMode==="asc"){
        currentChute++;
    }else{
        currentChute--;
    }
}

/* ===== 入力 ===== */
document.body.focus();

document.addEventListener("keydown", e=>{
    if(e.key==="Enter"){

        if(mode==="batch"){
            workCode=buffer;
            updateBatch();
        }
        else if(mode==="start"){
            currentChute=parseInt(buffer,10);
            updateChute();
            speak(currentChute+"番シュート");
        }
        else if(isWorking){
            processResult(buffer);
        }

        buffer="";
        mode="";
    }else{
        buffer+=e.key;
    }
});

/* ===== 開始 ===== */
function startWork(){

    if(!workCode){
        alert("バッチ未設定");
        return;
    }

    if(!confirm("開始しますか？")) return;

    isWorking=true;

    if(orderMode==="desc"){
        currentChute=getMaxChute();
    }

    updateChute();
    speak(currentChute+"番シュート");

    document.body.style.background="#e8f5e9";
}

/* ===== 判定 ===== */
function processResult(data){

    let max = getMaxChute();
    let expected=workCode+"/"+pad(currentChute);

    if(data===expected){

        // ★最終シュート判定
        let isLast = false;

        if(orderMode==="asc"){
            isLast = currentChute === max;
        }else{
            isLast = currentChute === 1;
        }

        if(isLast){
            speak("完了です");
        }else{
            nextChute();
            speak(currentChute+"番");
        }

        updateChute("ok");
        addLog("OK",data);

        document.body.style.background="#4CAF50";
        setTimeout(()=>document.body.style.background="#e8f5e9",200);

    }else{

        updateChute("ng");
        addLog("NG",data);

        speak("違います 正しくは "+currentChute+"番");

        document.body.style.background="red";
        setTimeout(()=>document.body.style.background="#e8f5e9",300);
    }
}

/* ===== 完了 ===== */
function completeBatch(){

    let max=getMaxChute();

    let finished=false;

    if(orderMode==="asc"){
        finished=currentChute>max;
    }else{
        finished=currentChute<1;
    }

    if(!finished){
        if(!confirm("最終シュートまで確認していません。次に進みますか？")) return;
    }

    let num=parseInt(workCode,10)+1;

    workCode=num.toString().padStart(8,"0");
    currentChute=1;
    isWorking=false;

    updateBatch();
    updateChute();

    document.body.style.background="#f5f5f5";
}

/* ===== 表示 ===== */
function updateBatch(){
    document.getElementById("batchBig").innerText=workCode;
}

function updateChute(state){
    let el=document.getElementById("chuteDisplay");
    el.innerText=pad(currentChute);
    el.className=state||"";
}

/* ===== CSV ===== */
function addLog(type,data){
    let time=new Date().toLocaleTimeString();
    csvData.push({time,batch:workCode,result:type,value:data});
}

function downloadCSV(){

    if(csvData.length===0){
        alert("データなし");
        return;
    }

    let csv="時間,バッチ,結果,内容\n";

    csvData.forEach(r=>{
        csv+=`${r.time},${r.batch},${r.result},${r.value}\n`;
    });

    let blob=new Blob([csv],{type:"text/csv"});
    let a=document.createElement("a");

    a.href=URL.createObjectURL(blob);
    a.download="log.csv";
    a.click();
}

/* ===== 共通 ===== */
function pad(n){
    return n.toString().padStart(3,"0");
}
</script>

</body>
</html>
