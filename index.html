<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>シュート照合</title>

<style>
body {
    font-family: Arial;
    text-align: center;
    margin-top: 40px;
}
input {
    font-size: 26px;
    padding: 10px;
    width: 200px;
    text-align: center;
    margin: 15px;
}
#result {
    font-size: 32px;
    margin-top: 30px;
    font-weight: bold;
}
button {
    font-size: 18px;
    padding: 8px 15px;
}
</style>
</head>

<body>

<h2>シュート番号 照合</h2>

<p>① シュート番号入力</p>
<input id="chute" type="text" placeholder="シュート番号">

<p>② ラベル番号（Googleレンズで読取）</p>
<input id="label" type="text" placeholder="ラベル番号">

<br>
<button onclick="checkMatch()">照合</button>

<div id="result"></div>

<script>

function playErrorSound() {
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const oscillator = audioCtx.createOscillator();
    const gainNode = audioCtx.createGain();
    oscillator.connect(gainNode);
    gainNode.connect(audioCtx.destination);
    oscillator.frequency.value = 500;
    oscillator.start();
    oscillator.stop(audioCtx.currentTime + 0.3);
}

function checkMatch() {
    const chute = document.getElementById("chute").value.trim();
    const label = document.getElementById("label").value.trim();
    const result = document.getElementById("result");

    if (!chute || !label) return;

    if (chute === label) {
        result.innerHTML = "✅ 一致しました";
        result.style.color = "green";
    } else {
        result.innerHTML = "❌ 不一致です";
        result.style.color = "red";
        playErrorSound();
    }
}

</script>

</body>
</html>
