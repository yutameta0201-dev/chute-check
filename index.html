<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>QR連番チェック 強化版</title>

<script src="https://cdn.jsdelivr.net/npm/jsqr/dist/jsQR.js"></script>

<style>
body {
    font-family: sans-serif;
    text-align: center;
    margin: 0;
}

video {
    width: 90%;
    max-width: 400px;
    border: 2px solid black;
}

.container {
    position: relative;
    display: inline-block;
}

#overlay {
    position: absolute;
    border: 3px solid red;
    width: 30%;
    height: 15%;
    top: 42%;
    left: 35%;
}

/* 🔴 デカ表示 */
#chuteDisplay {
    font-size: 60px;
    font-weight: bold;
    margin: 10px;
}

.ok { color: green; }
.ng { color: red; }

#result {
    font-size: 28px;
    font-weight: bold;
}

/* ボタン */
.big {
    font-size: 28px;
    padding: 20px 50px;
    margin: 10px;
}

/* フラッシュ */
.flash {
    animation: flash 0.8s;
}

@keyframes flash {
0%{background:white;}
25%{background:red;}
50%{background:white;}
75%{background:red;}
100%{background:white;}
}
</style>
</head>

<body>

<h2>QR連番チェック</h2>

<button onclick="readWork()">作業QR読み取り</button><br>

開始シュート:
<input type="number" id="startChute" value="1"><br>

<!-- 🔴 デカ表示 -->
<div id="chuteDisplay">---</div>

<button class="big" onclick="scanQR()">読み取り</button>

<div class="container">
    <video id="video" autoplay playsinline></video>
    <div id="overlay"></div>
</div>

<p id="result"></p>

<audio id="okSound">
<source src="https://actions.google.com/sounds/v1/alarms/beep_short.ogg">
</audio>

<script>
let video = document.getElementById("video");
let workCode = null;
let currentChute = 1;
let isProcessing = false;

// カメラ
navigator.mediaDevices.getUserMedia({
    video:{ facingMode:"environment" }
}).then(stream=>video.srcObject=stream);

// 作業QR
function readWork(){
    captureQR((data)=>{
        if(!data.includes("/")){
            workCode = data;

            currentChute = parseInt(document.getElementById("startChute").value);

            updateDisplay("ok");

            document.getElementById("result").innerHTML =
                "作業番号: " + workCode;
        }else{
            alert("作業QRを読み取ってください");
        }
    });
}

// 読み取り
function scanQR(){

    if(!workCode){
        alert("先に作業QRを読み取ってください");
        return;
    }

    captureQR((data)=>{

        let expected = workCode + "/" + pad(currentChute);

        if(data === expected){

            document.getElementById("result").innerHTML =
                "OK ✔ " + data;
            document.getElementById("result").className="ok";

            document.getElementById("okSound").play();

            currentChute++;

            updateDisplay("ok");

        }else{

            document.getElementById("result").innerHTML =
                "NG ✖ " + data + "<br>次: " + expected;
            document.getElementById("result").className="ng";

            speakNG();

            document.body.classList.add("flash");
            setTimeout(()=>document.body.classList.remove("flash"),800);

            navigator.vibrate?.([200,100,200]);

            updateDisplay("ng");
        }
    });
}

// 表示更新
function updateDisplay(state){

    let el = document.getElementById("chuteDisplay");

    el.innerHTML = pad(currentChute);

    el.className = "";

    if(state === "ok") el.classList.add("ok");
    if(state === "ng") el.classList.add("ng");
}

// QR読み取り（中央のみ）
function captureQR(callback){

    if(isProcessing) return;
    isProcessing = true;

    let canvas = document.createElement("canvas");
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    let ctx = canvas.getContext("2d");

    ctx.drawImage(video,0,0);

    let cropX = canvas.width * 0.35;
    let cropY = canvas.height * 0.42;
    let cropWidth = canvas.width * 0.3;
    let cropHeight = canvas.height * 0.15;

    let imageData = ctx.getImageData(cropX, cropY, cropWidth, cropHeight);

    let code = jsQR(imageData.data, cropWidth, cropHeight);

    if(code){
        callback(code.data);
    }else{
        document.getElementById("result").innerHTML="QRなし";
    }

    isProcessing = false;
}

// ゼロ埋め
function pad(num){
    return num.toString().padStart(3,"0");
}

// 音声
function speakNG(){
    let u = new SpeechSynthesisUtterance("違います");
    u.lang="ja-JP";
    speechSynthesis.speak(u);
}
</script>

</body>
</html>
