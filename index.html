<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>シュート番号 自動照合</title>
<script src="https://unpkg.com/html5-qrcode"></script>

<style>
body {
    font-family: Arial;
    text-align: center;
    margin-top: 20px;
}
#reader {
    width: 300px;
    margin: auto;
}
input {
    font-size: 24px;
    padding: 8px;
    width: 180px;
    text-align: center;
    margin-top: 10px;
}
#result {
    font-size: 28px;
    margin-top: 20px;
    font-weight: bold;
}
</style>
</head>

<body>

<h2>シュート番号 自動照合（オンライン）</h2>

<p>① シュート番号をカメラで読み取る</p>
<div id="reader"></div>

<p>② ラベル番号を入力</p>
<input id="label" type="number" placeholder="ラベル番号">

<div id="result"></div>

<script>

let scannedCode = "";

// エラー音
function playErrorSound() {
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const oscillator = audioCtx.createOscillator();
    const gainNode = audioCtx.createGain();

    oscillator.connect(gainNode);
    gainNode.connect(audioCtx.destination);

    oscillator.type = "sine";
    oscillator.frequency.setValueAtTime(500, audioCtx.currentTime);
    gainNode.gain.setValueAtTime(0.5, audioCtx.currentTime);

    oscillator.start();
    oscillator.stop(audioCtx.currentTime + 0.3);
}

// QR読み取り成功時
function onScanSuccess(decodedText) {
    scannedCode = decodedText.trim();
    document.getElementById("result").innerHTML = "読取: " + scannedCode;
    document.getElementById("result").style.color = "black";
    checkMatch();
}

// 照合チェック
function checkMatch() {
    const label = document.getElementById("label").value.trim();
    const result = document.getElementById("result");

    if (!scannedCode || !label) return;

    if (scannedCode === label) {
        result.innerHTML = "✅ 一致しました";
        result.style.color = "green";
    } else {
        result.innerHTML = "❌ 不一致です";
        result.style.color = "red";
        playErrorSound();
    }
}

// 入力時に照合
document.getElementById("label").addEventListener("input", checkMatch);

// カメラ起動
const html5QrCode = new Html5Qrcode("reader");

html5QrCode.start(
    { facingMode: "environment" }, // ← 背面カメラ指定
    {
        fps: 10,
        qrbox: 250
    },
    onScanSuccess
).catch(err => {
    console.error("カメラ起動エラー:", err);
});


</script>

</body>
</html>
