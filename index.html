<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>検品アプリ（音声改善版）</title>

<style>
body {
    margin:0;
    font-family:sans-serif;
    background:#f5f5f5;
}

.container {
    display:grid;
    grid-template-rows: 160px 140px auto auto 1fr 160px;
    height:100vh;
    gap:10px;
    padding:10px;
}

.top {
    display:flex;
}

.btnBox {
    flex:1;
    margin:5px;
    border:3px solid black;
    background:white;
    font-size:36px;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    box-shadow: 0 6px 0 rgba(0,0,0,0.3);
}

.btnBox:active {
    transform: translateY(4px);
    box-shadow: 0 2px 0 rgba(0,0,0,0.3);
}

.activeMode {
    background:#4CAF50 !important;
    color:white;
}

.asc {
    background:#b3e5fc !important;
}

.desc {
    background:#f8bbd0 !important;
}

.batch-area {
    border:3px solid black;
    background:yellow;
    padding:10px;
}

#batchBig {
    font-size:100px;
    text-align:center;
    font-weight:bold;
}

#startBtn {
    width:100%;
    font-size:60px;
    padding:20px;
    background:#ff9800;
    color:white;
    border:none;
    border-radius:10px;
}

.center {
    border:3px solid black;
    background:white;
    display:flex;
    flex-direction:column;
}

#chuteDisplay {
    flex:1;
    font-size:12vw;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:bold;
}

.ok {
    color:green;
}

.ng {
    color:red;
}

.bottom {
    display:flex;
}

.btn {
    flex:1;
    margin:10px;
    font-size:32px;
}

.complete {
    background:#2196F3;
    color:white;
}

.csv {
    background:#4CAF50;
    color:white;
}
</style>
</head>

<body tabindex="0">

<div class="container">

    <div class="top">

        <div class="btnBox"
             id="batchBtn"
             onclick="setMode('batch')">
            バッチ
        </div>

        <div class="btnBox"
             id="startBtnTop"
             onclick="setMode('start')">
            開始シュート
        </div>

        <div class="btnBox asc"
             id="orderBtn"
             onclick="toggleOrder()">
            昇順
        </div>

    </div>

    <div class="top">

        <div class="btnBox activeMode"
             id="m1"
             onclick="setMachine(1)">
            1・2号機
        </div>

        <div class="btnBox"
             id="m3"
             onclick="setMachine(3)">
            3号機
        </div>

    </div>

    <div class="batch-area">
        <div>バッチNO</div>
        <div id="batchBig">---</div>
    </div>

    <button id="startBtn"
            onclick="startWork()">
        作業開始
    </button>

    <div class="center">
        <div>確認シュート</div>
        <div id="chuteDisplay">---</div>
    </div>

    <div class="bottom">

        <button class="btn complete"
                onclick="completeBatch()">
            完了 → 次へ
        </button>

        <button class="btn csv"
                onclick="downloadCSV()">
            CSV出力
        </button>

    </div>

</div>

<script>

let mode="";
let isWorking=false;

let workCode="";
let currentChute=1;
let startChute=1;
let buffer="";

let orderMode="asc";
let machineType=1;

let csvData=[];

let speaking=false;

/* =========================
   音声（改善版）
========================= */
function speak(text){

    try{

        if(speechSynthesis.speaking){
            speechSynthesis.cancel();
        }

        let u = new SpeechSynthesisUtterance(text);

        u.lang="ja-JP";

        // ★少し速く
        u.rate=1;

        // ★高さ
        u.pitch=0.75;

        // ★音量
        u.volume=2;

        speaking=true;

        u.onend=()=>{
            speaking=false;
        };

        speechSynthesis.speak(u);

    }catch(e){
        console.log(e);
    }
}

/* =========================
   モード
========================= */
function setMode(m){

    mode=m;

    document.getElementById("batchBtn")
        .classList.remove("activeMode");

    document.getElementById("startBtnTop")
        .classList.remove("activeMode");

    if(m==="batch"){

        document.getElementById("batchBtn")
            .classList.add("activeMode");

        speak("開始バッチのキューアールを読み込んでください");
    }

    if(m==="start"){

        document.getElementById("startBtnTop")
            .classList.add("activeMode");

        speak("検品を始めるシュートのキューアールを読み込んでください");
    }
}

/* =========================
   昇順降順
========================= */
function toggleOrder(){

    let btn=document.getElementById("orderBtn");

    btn.classList.remove("asc","desc");

    if(orderMode==="asc"){

        orderMode="desc";

        btn.innerText="降順";

        btn.classList.add("desc");

        speak("降順モードです");

    }else{

        orderMode="asc";

        btn.innerText="昇順";

        btn.classList.add("asc");

        speak("昇順モードです");
    }
}

/* =========================
   号機
========================= */
function setMachine(m){

    machineType=m;

    document.getElementById("m1")
        .classList.remove("activeMode");

    document.getElementById("m3")
        .classList.remove("activeMode");

    if(m===1){

        document.getElementById("m1")
            .classList.add("activeMode");

    }else{

        document.getElementById("m3")
            .classList.add("activeMode");
    }

    speak(m + "号機モードです");
}

/* =========================
   最大最小
========================= */
function getMaxChute(){

    if(machineType===1){
        return (startChute<=18)?18:36;
    }

    if(machineType===3){
        return (startChute<=20)?20:36;
    }

    return 36;
}

function getMinChute(){

    if(machineType===1){
        return (startChute<=18)?1:19;
    }

    if(machineType===3){
        return (startChute<=20)?1:21;
    }

    return 1;
}

/* =========================
   次シュート
========================= */
function nextChute(){

    if(orderMode==="asc"){

        currentChute++;

    }else{

        currentChute--;
    }
}

/* =========================
   キーボード入力
========================= */
document.body.focus();

document.addEventListener("keydown", e=>{

    if(e.key==="Enter"){

        if(mode==="batch"){

            workCode=buffer;

            updateBatch();

            speak("バッチ " + workCode + " を登録しました");
        }

        else if(mode==="start"){

            currentChute=parseInt(buffer,10);

            startChute=currentChute;

            updateChute();

            speak(currentChute + "ばんから開始します");
        }

        else if(isWorking){

            processResult(buffer);
        }

        buffer="";
        mode="";
    }
    else{

        buffer+=e.key;
    }
});

/* =========================
   作業開始
========================= */
function startWork(){

    if(!workCode){

        alert("バッチ未設定");

        speak("バッチが未設定です");

        return;
    }

    if(!confirm("開始しますか？")) return;

    isWorking=true;

    if(orderMode==="desc"){

        currentChute=getMaxChute();
    }

    updateChute();

    speak(currentChute + "ばんです");
}

/* =========================
   判定
========================= */
function processResult(data){

    if(data==="9999/999"){

        addLog("キャンセル","シュート"+currentChute);

        speak("スキップします");

        nextChute();

        updateChute();

        return;
    }

    let max=getMaxChute();

    let min=getMinChute();

    let expected=workCode+"/"+pad(currentChute);

    if(data===expected){

        let isLast=(orderMode==="asc")
            ? currentChute===max
            : currentChute===min;

        if(isLast){

            speak("全シュート完了です");

            nextChute();

        }else{

            nextChute();

            speak(currentChute + "ばんです");
        }

        updateChute("ok");

        addLog("OK",data);

    }else{

        updateChute("ng");

        addLog("NG",data);

        speak("違います " + currentChute + "ばんです");
    }
}

/* =========================
   完了
========================= */
function completeBatch(){

    let max=getMaxChute();

    let min=getMinChute();

    let finished=(orderMode==="asc")
        ? currentChute>max
        : currentChute<min;

    if(!finished){

        if(!confirm("最終シュートまで確認していません。次に進みますか？")) return;
    }

    let num=parseInt(workCode,10)+1;

    workCode=num.toString().padStart(8,"0");

    currentChute=1;

    startChute=1;

    isWorking=false;

    updateBatch();

    updateChute();

    speak("次のバッチへ進みます");
}

/* =========================
   表示更新
========================= */
function updateBatch(){

    document.getElementById("batchBig")
        .innerText=workCode;
}

function updateChute(state){

    let el=document.getElementById("chuteDisplay");

    el.innerText=pad(currentChute);

    el.className=state || "";
}

/* =========================
   CSV
========================= */
function downloadCSV(){

    if(csvData.length===0){

        alert("データなし");

        speak("データがありません");

        return;
    }

    let csv="時間,バッチ,結果,内容\n";

    csvData.forEach(r=>{

        csv+=`${r.time},${r.batch},${r.result},${r.value}\n`;
    });

    let bom="\uFEFF";

    let blob=new Blob(
        [bom + csv],
        {type:"text/csv;charset=utf-8;"}
    );

    let a=document.createElement("a");

    a.href=URL.createObjectURL(blob);

    a.download="log.csv";

    a.click();

    speak("シーエスブイを出力しました");
}

/* =========================
   ログ
========================= */
function addLog(type,data){

    let time=new Date().toLocaleTimeString();

    csvData.push({
        time,
        batch:workCode,
        result:type,
        value:data
    });
}

/* =========================
   ゼロ埋め
========================= */
function pad(n){

    return n.toString().padStart(3,"0");
}

</script>

</body>
</html>
