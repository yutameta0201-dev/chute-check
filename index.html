<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Chute Label Check OCR</title>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@2/dist/tesseract.min.js"></script>
<style>
body { font-family: sans-serif; text-align: center; }
video { width: 90%; max-width: 400px; border: 2px solid black; }
#overlay {
    position: absolute;
    border: 3px solid red;
    width: 60%;
    height: 30%;
    top: 35%;
    left: 20%;
}
.container {
    position: relative;
    display: inline-block;
}
input { font-size: 20px; padding: 5px; margin: 5px; }
button { font-size: 18px; padding: 8px 15px; margin: 5px; }
#result { font-size: 28px; font-weight: bold; margin-top: 10px; }
.red { color: red; }
.green { color: green; }
</style>
</head>
<body>

<h2>Chute → Label OCR Check</h2>

<input type="text" id="chute" placeholder="シュート番号入力"><br>

<div class="container">
    <video id="video" autoplay playsinline></video>
    <div id="overlay"></div>
</div><br>

<button onclick="startCamera()">カメラ開始</button>
<button onclick="capture()">読み取り</button>

<p id="result"></p>

<audio id="okSound">
<source src="https://actions.google.com/sounds/v1/cartoon/wood_plank_flicks.ogg">
</audio>
<audio id="ngSound">
<source src="https://actions.google.com/sounds/v1/alarms/beep_short.ogg">
</audio>

<script>
let video = document.getElementById("video");

function startCamera() {
    navigator.mediaDevices.getUserMedia({
        video: { facingMode: { exact: "environment" } }
    }).then(stream => {
        video.srcObject = stream;
    }).catch(() => {
        navigator.mediaDevices.getUserMedia({ video: true })
        .then(stream => video.srcObject = stream);
    });
}

function capture() {
    let canvas = document.createElement("canvas");
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    let ctx = canvas.getContext("2d");
    ctx.drawImage(video, 0, 0);

    // 中央60%×30%を切り取り
    let cropX = canvas.width * 0.2;
    let cropY = canvas.height * 0.35;
    let cropWidth = canvas.width * 0.6;
    let cropHeight = canvas.height * 0.3;

    let cropped = document.createElement("canvas");
    cropped.width = cropWidth;
    cropped.height = cropHeight;
    let croppedCtx = cropped.getContext("2d");
    croppedCtx.drawImage(canvas, cropX, cropY, cropWidth, cropHeight, 0, 0, cropWidth, cropHeight);

    Tesseract.recognize(
        cropped,
        'eng',
        { tessedit_char_whitelist: '0123456789' }
    ).then(({ data: { text } }) => {

        let labelNumber = text.replace(/[^0-9]/g, "").trim();
        let chuteNumber = document.getElementById("chute").value.trim();
        let result = document.getElementById("result");

        if (!labelNumber) {
            result.innerHTML = "数字が読めません";
            result.className = "red";
            document.getElementById("ngSound").play();
            return;
        }

        if (labelNumber === chuteNumber) {
            result.innerHTML = "OK ✔ " + labelNumber;
            result.className = "green";
            document.getElementById("okSound").play();
        } else {
            result.innerHTML = "NG ✖ " + labelNumber;
            result.className = "red";
            document.getElementById("ngSound").play();
        }
    });
}
</script>

</body>
</html>
