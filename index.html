<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">

<title>QR連番チェック 完全版</title>

<link rel="manifest" href="manifest.json">
<script src="https://cdn.jsdelivr.net/npm/jsqr/dist/jsQR.js"></script>

<style>
body { font-family:sans-serif; text-align:center; margin:0; }

/* 🔴 作業バッチボタン（10倍） */
.big-start-btn {
    font-size: 60px;
    padding: 40px 80px;
    margin: 20px;
    background: #ff9800;
    color: white;
    border: none;
    border-radius: 15px;
}

/* 🔴 開始シュート（7倍） */
.start-label {
    font-size: 50px;
    font-weight: bold;
}

input {
    font-size: 40px;
    padding: 10px;
    width: 150px;
    text-align: center;
}

/* カメラ */
video { width:95%; max-width:500px; border:3px solid black; }

.container { position:relative; display:inline-block; }

#overlay {
    position:absolute;
    border:4px solid red;
    width:30%;
    height:15%;
    top:42%;
    left:35%;
}

/* デカ表示 */
#chuteDisplay {
    font-size:90px;
    font-weight:bold;
    margin:10px;
}

#result { font-size:32px; font-weight:bold; }

.ok { color:green; }
.ng { color:red; }

#log {
    max-height:200px;
    overflow:auto;
    border-top:2px solid #ccc;
    margin-top:10px;
    font-size:18px;
    text-align:left;
    padding:5px;
}

.flash { animation: flash 0.6s; }
@keyframes flash {
0%{background:white;}
25%{background:red;}
50%{background:white;}
75%{background:red;}
100%{background:white;}
}
</style>
</head>

<body>

<h2>QR連番チェック</h2>

<!-- 🔴 名前変更＋巨大化 -->
<button class="big-start-btn" onclick="readWork()">
作業バッチナンバー
</button>

<br>

<!-- 🔴 超デカ文字 -->
<span class="start-label">開始シュート：</span>
<input type="number" id="startChute" value="1">

<div id="chuteDisplay">---</div>

<div class="container">
    <video id="video" autoplay playsinline></video>
    <div id="overlay"></div>
</div>

<p id="result"></p>
<div id="log"></div>

<audio id="okSound">
<source src="https://actions.google.com/sounds/v1/alarms/beep_short.ogg">
</audio>

<script>
let video = document.getElementById("video");
let workCode = null;
let currentChute = 1;
let lastRead = "";
let isProcessing = false;

navigator.mediaDevices.getUserMedia({
    video:{ facingMode:"environment" }
}).then(stream=>video.srcObject=stream);

function readWork(){
    captureQR((data)=>{
        if(!data.includes("/")){
            workCode = data;
            currentChute = parseInt(document.getElementById("startChute").value);
            updateDisplay("ok");
            setResult("作業番号: " + workCode, "");
        }
    });
}

setInterval(()=>{
    if(workCode){
        captureQR(processResult);
    }
}, 800);

function processResult(data){

    if(data === lastRead) return;
    lastRead = data;

    let expected = workCode + "/" + pad(currentChute);

    if(data === expected){

        setResult("OK ✔ " + data, "ok");
        document.getElementById("okSound").play();
        addLog("OK", data);

        currentChute++;
        updateDisplay("ok");

    }else{

        setResult("NG ✖ " + data + " / 次: " + expected, "ng");

        speakNG();
        addLog("NG", data);

        document.body.classList.add("flash");
        setTimeout(()=>document.body.classList.remove("flash"),600);

        navigator.vibrate?.([200,100,200]);

        updateDisplay("ng");
    }
}

function updateDisplay(state){
    let el = document.getElementById("chuteDisplay");
    el.innerHTML = pad(currentChute);
    el.className = state;
}

function setResult(text, cls){
    let el = document.getElementById("result");
    el.innerHTML = text;
    el.className = cls;
}

function addLog(type, data){
    let time = new Date().toLocaleTimeString();
    let log = document.getElementById("log");

    log.innerHTML =
        "[" + time + "] " + type + " : " + data + "<br>" + log.innerHTML;
}

function captureQR(callback){

    if(isProcessing) return;
    isProcessing = true;

    let canvas = document.createElement("canvas");
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    let ctx = canvas.getContext("2d");

    ctx.drawImage(video,0,0);

    let cropX = canvas.width * 0.35;
    let cropY = canvas.height * 0.42;
    let cropWidth = canvas.width * 0.3;
    let cropHeight = canvas.height * 0.15;

    let imageData = ctx.getImageData(cropX, cropY, cropWidth, cropHeight);
    let code = jsQR(imageData.data, cropWidth, cropHeight);

    if(code){
        callback(code.data);
    }

    isProcessing = false;
}

let buffer = "";
document.addEventListener("keydown", e=>{
    if(e.key==="Enter"){
        if(buffer){
            processResult(buffer);
            buffer="";
        }
    }else{
        buffer += e.key;
    }
});

function speakNG(){
    let u = new SpeechSynthesisUtterance("違います");
    u.lang="ja-JP";
    speechSynthesis.speak(u);
}

function pad(num){
    return num.toString().padStart(3,"0");
}

if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js');
}
</script>

</body>
</html>
