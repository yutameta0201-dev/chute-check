<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>QR連番チェック 完全版</title>

<script src="https://cdn.jsdelivr.net/npm/jsqr/dist/jsQR.js"></script>

<style>
body { font-family:sans-serif; text-align:center; margin:0; }

video { width:95%; max-width:500px; border:3px solid black; }

.container { position:relative; display:inline-block; }

#overlay {
    position:absolute;
    border:4px solid red;
    width:30%;
    height:15%;
    top:42%;
    left:35%;
}

/* デカ表示 */
#chuteDisplay {
    font-size:90px;
    font-weight:bold;
    margin:10px;
}

/* 結果 */
#result { font-size:32px; font-weight:bold; }

.ok { color:green; }
.ng { color:red; }

/* ログ */
#log {
    max-height:200px;
    overflow:auto;
    border-top:2px solid #ccc;
    margin-top:10px;
    font-size:18px;
    text-align:left;
    padding:5px;
}

/* フラッシュ */
.flash { animation: flash 0.6s; }
@keyframes flash {
0%{background:white;}
25%{background:red;}
50%{background:white;}
75%{background:red;}
100%{background:white;}
}
</style>
</head>

<body>

<h2>QR連番チェック（完全版）</h2>

<button onclick="readWork()">作業QR読み取り</button><br>

開始シュート:
<input type="number" id="startChute" value="1"><br>

<div id="chuteDisplay">---</div>

<div class="container">
    <video id="video" autoplay playsinline></video>
    <div id="overlay"></div>
</div>

<p id="result"></p>

<!-- ログ -->
<div id="log"></div>

<audio id="okSound">
<source src="https://actions.google.com/sounds/v1/alarms/beep_short.ogg">
</audio>

<script>
let video = document.getElementById("video");
let workCode = null;
let currentChute = 1;

let lastRead = "";
let isProcessing = false;

/* カメラ */
navigator.mediaDevices.getUserMedia({
    video:{ facingMode:"environment" }
}).then(stream=>video.srcObject=stream);

/* 作業QR */
function readWork(){
    captureQR((data)=>{
        if(!data.includes("/")){
            workCode = data;
            currentChute = parseInt(document.getElementById("startChute").value);
            updateDisplay("ok");
            setResult("作業番号: " + workCode, "");
        }else{
            alert("作業QRを読んでください");
        }
    });
}

/* 自動スキャン */
setInterval(()=>{
    if(workCode){
        captureQR(processResult);
    }
}, 800);

/* 判定 */
function processResult(data){

    if(data === lastRead) return;
    lastRead = data;

    let expected = workCode + "/" + pad(currentChute);

    if(data === expected){

        setResult("OK ✔ " + data, "ok");
        document.getElementById("okSound").play();

        addLog("OK", data);

        currentChute++;
        updateDisplay("ok");

    }else{

        setResult("NG ✖ " + data + " / 次: " + expected, "ng");

        speakNG();

        addLog("NG", data);

        document.body.classList.add("flash");
        setTimeout(()=>document.body.classList.remove("flash"),600);

        navigator.vibrate?.([200,100,200]);

        updateDisplay("ng");
    }
}

/* 表示 */
function updateDisplay(state){
    let el = document.getElementById("chuteDisplay");
    el.innerHTML = pad(currentChute);
    el.className = state;
}

/* 結果 */
function setResult(text, cls){
    let el = document.getElementById("result");
    el.innerHTML = text;
    el.className = cls;
}

/* ログ追加 */
function addLog(type, data){

    let time = new Date().toLocaleTimeString();

    let log = document.getElementById("log");

    log.innerHTML =
        "[" + time + "] " + type + " : " + data + "<br>" + log.innerHTML;
}

/* QR */
function captureQR(callback){

    if(isProcessing) return;
    isProcessing = true;

    let canvas = document.createElement("canvas");
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    let ctx = canvas.getContext("2d");

    ctx.drawImage(video,0,0);

    let cropX = canvas.width * 0.35;
    let cropY = canvas.height * 0.42;
    let cropWidth = canvas.width * 0.3;
    let cropHeight = canvas.height * 0.15;

    let imageData = ctx.getImageData(cropX, cropY, cropWidth, cropHeight);

    let code = jsQR(imageData.data, cropWidth, cropHeight);

    if(code){
        callback(code.data);
    }

    isProcessing = false;
}

/* Bluetoothスキャナ入力 */
let inputBuffer = "";

document.addEventListener("keydown", function(e){

    if(e.key === "Enter"){

        if(inputBuffer){
            processResult(inputBuffer);
            inputBuffer = "";
        }

    }else{
        inputBuffer += e.key;
    }

});

/* 音声 */
function speakNG(){
    let u = new SpeechSynthesisUtterance("違います");
    u.lang="ja-JP";
    speechSynthesis.speak(u);
}

/* ゼロ埋め */
function pad(num){
    return num.toString().padStart(3,"0");
}
</script>

</body>
</html>
