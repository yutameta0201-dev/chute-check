<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>検品アプリ（大画面）</title>

<style>
body {
    margin:0;
    font-family:sans-serif;
    background:#f5f5f5;
}

/* グリッド全体 */
.container {
    display:grid;
    grid-template-rows: 120px 1fr 150px;
    height:100vh;
    gap:10px;
    padding:10px;
}

/* 上段 */
.top {
    display:flex;
    justify-content:space-between;
}

.box {
    flex:1;
    margin:5px;
    border:3px solid black;
    background:white;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:40px;
    font-weight:bold;
}

/* 中央 */
.center {
    border:3px solid black;
    background:white;
    display:flex;
    flex-direction:column;
}

.label {
    font-size:24px;
    padding:5px;
}

.big-display {
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:140px;
    font-weight:bold;
}

/* 下段 */
.bottom {
    display:flex;
    justify-content:space-between;
}

.btn {
    flex:1;
    margin:10px;
    font-size:40px;
    border:none;
    border-radius:10px;
}

.complete {
    background:#2196F3;
    color:white;
}

.csv {
    background:#4CAF50;
    color:white;
}

/* 状態色 */
.ok { color:green; }
.ng { color:red; }

</style>
</head>

<body tabindex="0">

<div class="container">

    <!-- 上 -->
    <div class="top">
        <div class="box" id="batchDisplay">検品バッチ</div>
        <div class="box">開始シュート指定</div>
    </div>

    <!-- 中 -->
    <div class="center">
        <div class="label">確認シュート</div>
        <div class="big-display" id="chuteDisplay">---</div>
    </div>

    <!-- 下 -->
    <div class="bottom">
        <button class="btn complete" onclick="completeBatch()">完了 → 次へ</button>
        <button class="btn csv" onclick="downloadCSV()">CSV出力</button>
    </div>

</div>

<script>
let workCode = "";
let currentChute = 1;
let buffer = "";
let okCount = 0;
let ngCount = 0;
let csvData = [];

/* スキャナ入力 */
document.body.focus();

document.addEventListener("keydown", e=>{

    if(e.key==="Enter"){

        if(!workCode){
            workCode = buffer;
            updateBatch();
            buffer="";
            return;
        }

        processResult(buffer);
        buffer="";

    }else{
        buffer += e.key;
    }
});

function processResult(data){

    let expected = workCode + "/" + pad(currentChute);

    if(data === expected){

        okCount++;
        currentChute++;
        updateChute("ok");

        addLog("OK", data);

    }else{

        ngCount++;

        speakNG();

        document.body.style.background="red";
        setTimeout(()=>document.body.style.background="#f5f5f5",300);

        updateChute("ng");
        addLog("NG", data);
    }
}

/* 完了 */
function completeBatch(){

    if(!workCode) return;

    let num = parseInt(workCode,10);
    num++;

    workCode = num.toString().padStart(8,"0");
    currentChute = 1;

    updateBatch();
    updateChute();
}

/* 表示 */
function updateBatch(){
    document.getElementById("batchDisplay").innerText = workCode;
}

function updateChute(state){
    let el = document.getElementById("chuteDisplay");
    el.innerText = pad(currentChute);
    el.className = "big-display " + (state || "");
}

/* ログ */
function addLog(type,data){
    let time = new Date().toLocaleTimeString();

    csvData.push({
        time: time,
        batch: workCode,
        result: type,
        value: data
    });
}

/* CSV */
function downloadCSV(){

    let csv = "時間,バッチ,結果,読取値\n";

    csvData.forEach(r=>{
        csv += `${r.time},${r.batch},${r.result},${r.value}\n`;
    });

    let blob = new Blob([csv], {type:"text/csv"});
    let link = document.createElement("a");

    link.href = URL.createObjectURL(blob);
    link.download = "log.csv";
    link.click();
}

/* 音声 */
function speakNG(){
    let u = new SpeechSynthesisUtterance("違います");
    u.lang="ja-JP";
    speechSynthesis.speak(u);
}

function pad(num){
    return num.toString().padStart(3,"0");
}
</script>

</body>
</html>
