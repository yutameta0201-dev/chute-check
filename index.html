<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>連番 強制スキャンモード（音声付）</title>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@2/dist/tesseract.min.js"></script>

<style>
body {
    font-family: sans-serif;
    text-align: center;
    margin: 0;
    background-color: white;
}

video {
    width: 90%;
    max-width: 400px;
    border: 2px solid black;
}

.container {
    position: relative;
    display: inline-block;
}

#overlay {
    position: absolute;
    border: 3px solid red;
    width: 40%;
    height: 20%;
    top: 40%;
    left: 30%;
}

input {
    font-size: 22px;
    padding: 5px;
    margin: 5px;
    text-align: center;
}

button {
    font-size: 18px;
    padding: 8px 15px;
    margin: 5px;
}

#result {
    font-size: 30px;
    font-weight: bold;
    margin-top: 10px;
}

.red { color: red; }
.green { color: green; }

/* 🔴 2回赤点滅 */
.flash-red {
    animation: flashRed 0.8s;
}

@keyframes flashRed {
    0% { background-color: white; }
    20% { background-color: red; }
    40% { background-color: white; }
    60% { background-color: red; }
    80% { background-color: white; }
    100% { background-color: white; }
}
</style>
</head>

<body>

<h2>連番 強制スキャンモード（音声付）</h2>

<input type="text" id="startNumber" placeholder="開始番号入力 (例:019)"><br>

<div class="container">
    <video id="video" autoplay playsinline></video>
    <div id="overlay"></div>
</div><br>

<button onclick="startScan()">START</button>
<button onclick="pauseScan()">PAUSE</button>

<p id="result"></p>

<audio id="okSound">
<source src="https://actions.google.com/sounds/v1/cartoon/wood_plank_flicks.ogg">
</audio>
<audio id="ngSound">
<source src="https://actions.google.com/sounds/v1/alarms/beep_short.ogg">
</audio>

<script>
let video = document.getElementById("video");
let isProcessing = false;
let isScanning = false;
let scanInterval;
let currentNumber = null;
let digitLength = 0;

// カメラ起動
navigator.mediaDevices.getUserMedia({
    video: { facingMode: { exact: "environment" } }
}).then(stream => {
    video.srcObject = stream;
}).catch(() => {
    navigator.mediaDevices.getUserMedia({ video: true })
    .then(stream => video.srcObject = stream);
});

// 女性音声取得
function getFemaleVoice() {
    let voices = speechSynthesis.getVoices();
    return voices.find(v => v.lang === "ja-JP" && v.name.toLowerCase().includes("female"))
        || voices.find(v => v.lang === "ja-JP")
        || null;
}

// 音声読み上げ
function speakError(message) {
    const utter = new SpeechSynthesisUtterance(message);
    utter.lang = "ja-JP";
    utter.rate = 1;
    utter.pitch = 1.2; // 少し高め＝女性っぽく

    let voice = getFemaleVoice();
    if (voice) utter.voice = voice;

    speechSynthesis.cancel();
    speechSynthesis.speak(utter);
}

function startScan() {

    let input = document.getElementById("startNumber").value.trim();
    if (!input) return alert("開始番号を入力してください");

    digitLength = input.length;
    currentNumber = parseInt(input, 10);

    isScanning = true;

    scanInterval = setInterval(() => {
        if (!isProcessing) capture();
    }, 1000);
}

function pauseScan() {
    isScanning = false;
    clearInterval(scanInterval);
}

function padNumber(num) {
    return num.toString().padStart(digitLength, "0");
}

function capture() {

    if (!isScanning) return;

    isProcessing = true;

    let canvas = document.createElement("canvas");
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    let ctx = canvas.getContext("2d");
    ctx.drawImage(video, 0, 0);

    let cropX = canvas.width * 0.3;
    let cropY = canvas.height * 0.4;
    let cropWidth = canvas.width * 0.4;
    let cropHeight = canvas.height * 0.2;

    let cropped = document.createElement("canvas");
    cropped.width = cropWidth;
    cropped.height = cropHeight;
    let croppedCtx = cropped.getContext("2d");
    croppedCtx.drawImage(
        canvas,
        cropX, cropY, cropWidth, cropHeight,
        0, 0, cropWidth, cropHeight
    );

    Tesseract.recognize(
        cropped,
        'eng',
        {
            tessedit_char_whitelist: '0123456789',
            tessedit_pageseg_mode: 7
        }
    ).then(({ data: { text } }) => {

        let readNumber = text.replace(/[^0-9]/g, "").trim();
        let expected = padNumber(currentNumber);
        let result = document.getElementById("result");

        if (!readNumber) {
            isProcessing = false;
            return;
        }

        if (readNumber === expected) {

            result.innerHTML = "OK ✔ " + readNumber;
            result.className = "green";
            document.getElementById("okSound").play();

            currentNumber++;

        } else {

            result.innerHTML = "NG ✖ " + readNumber + " (次: " + expected + ")";
            result.className = "red";
            document.getElementById("ngSound").play();

            document.body.classList.add("flash-red");
            setTimeout(() => {
                document.body.classList.remove("flash-red");
            }, 800);

            if (navigator.vibrate) {
                navigator.vibrate([200,100,200]);
            }

            // 🗣 女性音声読み上げ
            speakError("ラベルが違います。次は " + expected + " です。");
        }

        setTimeout(() => {
            isProcessing = false;
        }, 800);
    });
}
</script>

</body>
</html>
