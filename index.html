<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>検品アプリ（最終完成版）</title>

<style>
body { margin:0; font-family:sans-serif; background:#f5f5f5; }

.container {
    display:grid;
    grid-template-rows: 120px auto auto 1fr 180px;
    height:100vh;
    gap:10px;
    padding:10px;
}

.top { display:flex; }

.btnBox {
    flex:1;
    margin:5px;
    border:3px solid black;
    background:white;
    font-size:36px;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    transition: all 0.1s ease;
    box-shadow: 0 6px 0 rgba(0,0,0,0.3);
}

.btnBox:active {
    transform: translateY(4px);
    box-shadow: 0 2px 0 rgba(0,0,0,0.3);
}

.activeMode {
    background:#4CAF50 !important;
    color:white;
}

.batch-area {
    border:3px solid black;
    background:yellow;
    padding:10px;
}

#batchBig {
    font-size:110px;
    text-align:center;
    font-weight:bold;
}

#startBtn {
    width:100%;
    font-size:60px;
    padding:20px;
    background:#ff9800;
    color:white;
    border:none;
    border-radius:10px;
    transition: all 0.1s ease;
    box-shadow: 0 6px 0 rgba(0,0,0,0.3);
}

#startBtn:active {
    transform: translateY(4px);
    box-shadow: 0 2px 0 rgba(0,0,0,0.3);
    background:#e68900;
}

.center {
    border:3px solid black;
    background:white;
    display:flex;
    flex-direction:column;
}

.label { font-size:20px; }

#chuteDisplay {
    flex:1;
    font-size:100px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:bold;
}

.ok { color:green; }
.ng { color:red; }

.bottom { display:flex; }

.btn {
    flex:1;
    margin:10px;
    font-size:36px;
    border:none;
    transition: all 0.1s ease;
    box-shadow: 0 6px 0 rgba(0,0,0,0.3);
}

.btn:active {
    transform: translateY(4px);
    box-shadow: 0 2px 0 rgba(0,0,0,0.3);
}

.complete { background:#2196F3; color:white; }
.csv { background:#4CAF50; color:white; }

</style>
</head>

<body tabindex="0">

<div class="container">

    <div class="top">
        <div class="btnBox" id="batchBtn" onclick="setMode('batch')">検品バッチ</div>
        <div class="btnBox" id="startBtnTop" onclick="setMode('start')">開始シュート指定</div>
    </div>

    <div class="batch-area">
        <div>バッチNO</div>
        <div id="batchBig">---</div>
    </div>

    <button id="startBtn" onclick="startWork()">作業開始</button>

    <div class="center">
        <div class="label">確認シュート</div>
        <div id="chuteDisplay">---</div>
    </div>

    <div class="bottom">
        <button class="btn complete" onclick="completeBatch()">完了 → 次へ</button>
        <button class="btn csv" onclick="downloadCSV()">CSV出力</button>
    </div>

</div>

<script>
let mode = "";
let isWorking = false;

let workCode = "";
let currentChute = 1;
let buffer = "";

let csvData = [];

function setMode(m){
    mode = m;

    document.getElementById("batchBtn").classList.remove("activeMode");
    document.getElementById("startBtnTop").classList.remove("activeMode");

    if(m === "batch"){
        document.getElementById("batchBtn").classList.add("activeMode");
    }else if(m === "start"){
        document.getElementById("startBtnTop").classList.add("activeMode");
    }
}

document.body.focus();

document.addEventListener("keydown", e=>{

    if(e.key==="Enter"){

        if(mode === "batch"){
            workCode = buffer;
            updateBatch();
            mode="";
            setMode("");
        }
        else if(mode === "start"){
            currentChute = parseInt(buffer,10);
            updateChute();
            mode="";
            setMode("");
        }
        else if(isWorking){
            processResult(buffer);
        }

        buffer="";

    }else{
        buffer += e.key;
    }
});

function startWork(){

    if(!workCode){
        alert("バッチ未設定");
        return;
    }

    isWorking = true;
    updateChute();
    document.body.style.background="#e8f5e9";
}

/* 判定 */
function processResult(data){

    /* ★キャンセル処理 */
    if(data === "9999/999"){
        addLog("キャンセル", "シュート" + currentChute);
        currentChute++;
        updateChute();
        return;
    }

    let expected = workCode + "/" + pad(currentChute);

    if(data === expected){

        currentChute++;
        updateChute("ok");
        addLog("OK", data);

    }else{

        updateChute("ng");
        speakNG();
        addLog("NG", data);

        document.body.style.background="red";
        setTimeout(()=>document.body.style.background="#e8f5e9",300);
    }
}

function completeBatch(){

    let num = parseInt(workCode,10);
    num++;

    workCode = num.toString().padStart(8,"0");
    currentChute = 1;
    isWorking = false;

    updateBatch();
    updateChute();

    document.body.style.background="#f5f5f5";
}

function updateBatch(){
    document.getElementById("batchBig").innerText = workCode;
}

function updateChute(state){
    let el = document.getElementById("chuteDisplay");
    el.innerText = pad(currentChute);
    el.className = state || "";
}

/* CSV */
function addLog(type,data){
    let time = new Date().toLocaleTimeString();
    csvData.push({time,batch:workCode,result:type,value:data});
}

function downloadCSV(){

    if(csvData.length === 0){
        alert("データなし");
        return;
    }

    let csv="時間,バッチ,結果,内容\n";

    csvData.forEach(r=>{
        csv+=`${r.time},${r.batch},${r.result},${r.value}\n`;
    });

    let blob=new Blob([csv],{type:"text/csv"});
    let a=document.createElement("a");

    let date = new Date().toISOString().slice(0,10);

    a.href=URL.createObjectURL(blob);
    a.download="log_"+date+".csv";
    a.click();
}

function speakNG(){
    let u=new SpeechSynthesisUtterance("違います");
    u.lang="ja-JP";
    speechSynthesis.speak(u);
}

function pad(n){
    return n.toString().padStart(3,"0");
}
</script>

</body>
</html>
