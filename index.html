<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>順番チェックOCR 安定版</title>

<!-- Tesseract 安定CDN -->
<script src="https://unpkg.com/tesseract.js@4.1.1/dist/tesseract.min.js"></script>

<style>
body{
    margin:0;
    background:black;
    color:white;
    text-align:center;
    font-family:sans-serif;
}

video{
    width:100%;
    max-width:400px;
    margin-top:10px;
}

#overlay{
    position:absolute;
    border:3px solid lime;
    width:130px;      /* ← 小さめ枠 */
    height:55px;
    top:40%;
    left:50%;
    transform:translate(-50%,-50%);
}

.flash{
    animation: flashRed 0.25s;
}

@keyframes flashRed{
    0%{background:red;}
    100%{background:black;}
}

button,input{
    font-size:18px;
    margin:5px;
}
</style>
</head>

<body>

<h2>順番チェックOCR</h2>

開始番号:
<input type="number" id="startNum" placeholder="例: 019">
<button onclick="setStart()">設定</button>
<br>
<button onclick="startScan()">スタート</button>
<button onclick="stopScan()">一時停止</button>

<div style="position:relative;">
<video id="video" autoplay playsinline></video>
<div id="overlay"></div>
</div>

<h1 id="status">待機中</h1>

<script>
let currentNumber = 0;
let scanning = false;
let processing = false;

const video = document.getElementById("video");
const status = document.getElementById("status");

async function initCamera(){
    try{
        const stream = await navigator.mediaDevices.getUserMedia({
            video:{
                facingMode:"environment",
                width:{ideal:640},
                height:{ideal:480}
            }
        });
        video.srcObject = stream;
        await video.play();
    }catch(err){
        alert("カメラエラー: "+err);
    }
}

initCamera();

function setStart(){
    const val = document.getElementById("startNum").value;
    if(val===""){
        alert("開始番号を入力してください");
        return;
    }
    currentNumber = parseInt(val);
    status.innerText = "次は "+formatNumber(currentNumber);
}

function startScan(){
    if(currentNumber===0){
        alert("開始番号を設定してください");
        return;
    }
    scanning = true;
    scanLoop();
}

function stopScan(){
    scanning = false;
    status.innerText="停止中";
}

async function scanLoop(){
    if(!scanning || processing) return;

    processing = true;

    const canvas = document.createElement("canvas");
    const ctx = canvas.getContext("2d");

    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;

    ctx.drawImage(video,0,0);

    const result = await Tesseract.recognize(canvas,'eng',{
        tessedit_char_whitelist:'0123456789'
    });

    let text = result.data.text.replace(/\D/g,'');

    if(text !== ""){
        if(parseInt(text) === currentNumber){
            status.innerText = "OK "+formatNumber(currentNumber);
            navigator.vibrate([150]);
            currentNumber++;
        }else{
            status.innerText = "NG "+text;
            errorFlash();
        }
    }

    processing = false;

    setTimeout(scanLoop,1200);   // 負荷軽減
}

function errorFlash(){
    navigator.vibrate([200,100,200]);

    document.body.classList.add("flash");
    setTimeout(()=>document.body.classList.remove("flash"),250);

    setTimeout(()=>{
        document.body.classList.add("flash");
        setTimeout(()=>document.body.classList.remove("flash"),250);
    },400);
}

function formatNumber(num){
    return num.toString().padStart(3,'0');
}
</script>

</body>
</html>
