<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DPS棚番登録アプリ</title>
<style>
body{font-family:sans-serif;margin:0;background:#f5f5f5;padding:10px}
.zoneGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.zoneBtn{font-size:28px;padding:15px;border:none;border-radius:8px}
.active{outline:4px solid #000}
.info{background:#fff;border:2px solid #333;margin-top:10px;padding:10px}
.big{font-size:32px;font-weight:bold}
#history{height:250px;overflow:auto;background:#fff;border:2px solid #333;padding:5px}
button{cursor:pointer}
.tools{display:flex;gap:8px;margin-top:10px}
.tools button{flex:1;padding:12px;font-size:18px}
#oldRack{margin-top:20px;font-size:32px;font-weight:bold;color:#666;}
.modeActive{
    background:#4CAF50;
    color:white;
    font-weight:bold;
}
.complete{
    background:#90EE90;
}

.over{
    background:#ff9999;
}
</style>
</head>
<body tabindex="0">
<button onclick="resetInbound()">
入庫リセット
</button>
    
<h2>DPS棚番登録アプリ</h2>
    
<div class="tools">
   <button id="rackBtn"
onclick="showMode('rack')">棚番登録</button>

<button id="inboundBtn"
onclick="showMode('inbound')">入庫チェック</button>
</div>

<div id="rackMode">
    
<div class="info">
<div>商品コード</div>
<div id="itemCode" class="big">---</div>
</div>

<div class="info">
<div>商品名</div>
<div id="itemName" class="big">---</div>
</div>

<div class="info">
<div>現在棚番</div>
<div id="currentRack" class="big">---</div>
</div>

<div class="info">
<div>過去棚番</div>
<div id="oldRack" class="big">---</div>
</div>   

<div class="info">
<div>登録棚番</div>
<div id="newRack" class="big">---</div>
</div>

<div class="info">
登録件数：<span id="count">0</span><br>
商品マスタ件数：<span id="masterCount">0</span>
</div>

<div class="tools">
<input type="file" id="masterFile" accept=".csv">
<button onclick="clearRack()">棚クリア</button>
<button onclick="downloadCSV()">CSV出力</button>
</div>

<h3>履歴</h3>
<div id="history"></div>

</div>

<div id="inboundMode" style="display:none">

<div class="info">
<div>商品名</div>
<div id="inboundItemName" class="big">---</div>
</div>

<div class="info">
<div>棚番</div>
<div id="inboundRack" class="big">---</div>
</div>

<div class="info">
<div>入庫予定</div>
<div id="planQty" class="big">0</div>
</div>

<div class="info">
<div>入庫実績</div>
<div id="actualQty" class="big">0</div>
</div>

<div class="info">
<div>残数</div>
<div id="remainQty" class="big">0</div>
</div>

<input type="file" id="inboundFile" accept=".csv">

<button onclick="resetInbound()">
入庫リセット
</button>
<button onclick="downloadInboundCSV()">
入庫CSV出力
</button>
<h3>未完了一覧</h3>

<div id="inboundList"
style="
background:#fff;
border:2px solid #333;
height:250px;
overflow:auto;
padding:5px;
">
</div>

</div> 
<script>
let currentItem=null;

function convertProduct(scan){

    let code=scan.replace(/^0+/,"");

    code=code.slice(0,-1);

    return code;
}
 
let currentRack="";
let buffer="";
let master={};
let logs=[];

let inboundData=
JSON.parse(
    localStorage.getItem("dpsInbound") || "{}"
);
let actualData=
JSON.parse(
    localStorage.getItem("dpsActual") || "{}"
);

let lastScanCode="";    

const savedMaster=localStorage.getItem("dpsMaster");

if(savedMaster){

    master=JSON.parse(savedMaster);

    document.getElementById("masterCount").innerText=
        Object.keys(master).length;

    setTimeout(restoreLastItem,100);
}

function speak(t){
 try{
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(t);
  u.lang="ja-JP";
  speechSynthesis.speak(u);
 }catch(e){}
}

document.getElementById("masterFile").addEventListener("change",e=>{

 const file=e.target.files[0];

 if(!file)return;

 const r=new FileReader();

 r.onload=function(){

   master={};

   const lines=r.result.split(/\r?\n/);

   for(let i=1;i<lines.length;i++){

      const c=lines[i].split(",");

if(c.length>=10){
       
          master[c[0].trim()]={

    name:c[1].trim(),

    rack:
       c[2].trim()+"-"+
       c[3].trim()+"-"+
       c[4].trim(),

    oldRack:
       c[5].trim()+"-"+
       c[6].trim()+"-"+
       c[7].trim(),

    jan:(c[9] || "").trim()
};
      }
   }

  document.getElementById("masterCount").innerText=
      Object.keys(master).length;

localStorage.setItem(
    "dpsMaster",
    JSON.stringify(master)
);

speak("商品マスタを読み込みました");
 };

 r.readAsText(file,"utf-8");
});

document.getElementById("inboundFile").addEventListener("change",e=>{

 const file=e.target.files[0];
 if(!file)return;

 const r=new FileReader();

 r.onload=function(){

   inboundData={};

   const lines=r.result.split(/\r?\n/);

  for(let i=1;i<lines.length;i++){

    const c=lines[i].split(",");

    if(c.length<11) continue;

    const code=c[7].trim().replace(/^0+/,"");
const name=c[8].trim();
const qty=parseInt(c[10])||0;

    inboundData[code]={
        name:name,
        qty:qty
    };
}

localStorage.setItem(
    "dpsInbound",
    JSON.stringify(inboundData)
);

renderInboundList();

speak("入庫データを読み込みました");
 };

 r.readAsText(file,"utf-8");
});

   
function clearRack(){
 currentRack="";
 document.getElementById("newRack").innerText="---";
 speak("棚番クリア");
}

document.addEventListener("keydown",e=>{

    if(e.key==="Enter" || e.code==="NumpadEnter"){

        processScan(buffer.trim());

        buffer="";

        return;
    }

    if(e.key.length===1){

        buffer += e.key;
    }
});

function processScan(scan){

    if(!scan) return;

        if(scan==="ADD1"){
        addQty(1);
        return;
    }

    if(scan==="ADD5"){
        addQty(5);
        return;
    }

    if(scan==="ADD10"){
        addQty(10);
        return;
    }

    if(scan==="SUB1"){
        addQty(-1);
        return;
    }

    if(scan==="SUB5"){
        addQty(-5);
        return;
    }

    if(scan==="SUB10"){
        addQty(-10);
        return;
    }

    if(scan.includes("-")){

        registerRack(scan);

        return;
    }

    let code=convertProduct(scan);

    let item=master[code];

    if(!item){

        let foundCode = Object.keys(master).find(
            k => master[k].jan === scan
        );

        if(foundCode){

            code = foundCode;
            item = master[foundCode];
        }
    }

    if(!item){

        document.getElementById("itemName")
            .innerText="マスタ未登録";

        speak("マスタ未登録");

        return;
    }

    currentItem={

        code:code,

        name:item.name,

        currentRack:item.rack,

        oldRack:item.oldRack
    };
    localStorage.setItem(
    "lastItemCode",
    code
);

   if(localStorage.getItem("dpsMode")==="inbound"){

    if(!actualData[code]){
        actualData[code]=0;
    }

    actualData[code]++;

    localStorage.setItem(
        "dpsActual",
        JSON.stringify(actualData)
    );

    let plan=0;

    if(inboundData[code]){
        plan=inboundData[code].qty;
    }

    let actual=actualData[code] || 0;

    document.getElementById("planQty").innerText=plan;
    document.getElementById("actualQty").innerText=actual;
    document.getElementById("remainQty").innerText=
        plan-actual;

    renderInboundList();
}

document.getElementById("itemCode")
    .innerText=code;

document.getElementById("itemName")
    .innerText=item.name;

document.getElementById("currentRack")
    .innerText=item.rack;

document.getElementById("inboundItemName")
    .innerText=item.name;

document.getElementById("inboundRack")
    .innerText=item.rack;

document.getElementById("oldRack")
    .innerText=item.oldRack || "---";

document.getElementById("newRack")
    .innerText="---";

if(localStorage.getItem("dpsMode")==="inbound"){

    let plan=0;

    if(inboundData[code]){
        plan=inboundData[code].qty;
    }

    let actual=actualData[code] || 0;

    let remain=plan-actual;

    if(remain<=0){

        speak("完了");

    }else{

        speak("あと" + remain + "ケース");
    }

}else{

    speak(item.name);
}
}

function downloadCSV(){

 if(logs.length===0){
   alert("データなし");
   return;
 }

 let csv="日時,商品コード,商品名,現在棚番,登録棚番\n";

 
logs.forEach(r=>{
  csv+=`${r.time},${r.code},${r.name},="${r.currentRack}",="${r.newRack}"\n`;
});

 const blob=new Blob(["\uFEFF"+csv],{type:"text/csv"});
 const a=document.createElement("a");
 a.href=URL.createObjectURL(blob);
 a.download="DPS登録.csv";
a.click();

logs=[];

localStorage.removeItem("dpsLogs");

document.getElementById("count").innerText="0";

document.getElementById("history").innerHTML="";

speak("出力完了");
}

function addQty(q){

    if(!currentItem){

        speak("商品を読んでください");

        return;
    }

  let code=currentItem.code;

if(!actualData[code]){
    actualData[code]=0;
}

actualData[code]+=q;

if(actualData[code]<0){
    actualData[code]=0;
}

localStorage.setItem(
    "dpsActual",
    JSON.stringify(actualData)
);

let plan=0;

if(inboundData[code]){
    plan=inboundData[code].qty;
}

let remain=plan-actualData[code];

document.getElementById("actualQty").innerText=
    actualData[code];

document.getElementById("remainQty").innerText=
    remain;

   if(remain===0){

    speak("完了");

}else if(remain<0){

    speak("超過");

}else{

    speak(actualData[code].toString());
}

renderInboundList();
}

    
function registerRack(rack){

    if(!currentItem){

        speak("先に商品を読んでください");

        return;
    }

    let dup=logs.find(x=>

        x.code===currentItem.code &&

        x.newRack===rack
    );

    if(dup){

        speak("重複登録です");

        return;
    }

    document.getElementById("newRack")
        .innerText=rack;

    let now=new Date().toLocaleString();

    logs.push({

        time:now,

        code:currentItem.code,

        name:currentItem.name,

        currentRack:currentItem.currentRack,

        newRack:rack
    });
    localStorage.setItem(
    "dpsLogs",
    JSON.stringify(logs)
);

    document.getElementById("count")
        .innerText=logs.length;

    let h=document.getElementById("history");

    h.innerHTML=
        "<div>"+
        currentItem.code+" "+
        currentItem.name+
        " "+
        currentItem.currentRack+
        " → "+
        rack+
        "</div>"
        +h.innerHTML;

    speak("登録しました");

    currentItem=null;
}
function resetInbound(){

    if(!confirm("本日の入庫データを削除しますか？")){
        return;
    }

    inboundData={};
    actualData={};

    localStorage.removeItem("dpsInbound");
    localStorage.removeItem("dpsActual");

    document.getElementById("planQty").innerText="0";
    document.getElementById("actualQty").innerText="0";
    document.getElementById("remainQty").innerText="0";

    speak("リセットしました");
}
function downloadInboundCSV(){

    let csv=
    "商品コード,商品名,予定数,実績数,残数\n";

    Object.keys(inboundData).forEach(code=>{

        let plan=inboundData[code].qty;

        let actual=actualData[code] || 0;

        let remain=plan-actual;

        csv +=
        code + "," +
        inboundData[code].name + "," +
        plan + "," +
        actual + "," +
        remain + "\n";
    });

    const blob=new Blob(
        ["\uFEFF"+csv],
        {type:"text/csv"}
    );

    const a=document.createElement("a");

    a.href=
    URL.createObjectURL(blob);

    a.download=
    "入庫実績.csv";

    a.click();

    speak("出力しました");
}
    
function renderInboundList(){

    let html="";

    Object.keys(inboundData).forEach(code=>{

        let plan=inboundData[code].qty;

        let actual=actualData[code] || 0;

        let remain=plan-actual;

        if(remain<=0) return;

        let rack="";

        if(master[code]){
            rack=master[code].rack;
        }
        
    html +=
"<div style='padding:8px;border-bottom:1px solid #ddd'>" +
rack + "　" +
inboundData[code].name +
"　残:" +
remain +
"</div>";
    });

    document.getElementById("inboundList")
        .innerHTML=html;
}
    
  function restoreLastItem(){

    const code=
    localStorage.getItem("lastItemCode");

    if(!code) return;

    const item=master[code];

    if(!item) return;

    document.getElementById("itemCode")
        .innerText=code;

    document.getElementById("itemName")
        .innerText=item.name;

    document.getElementById("currentRack")
        .innerText=item.rack;

    document.getElementById("oldRack")
        .innerText=item.oldRack || "---";

    document.getElementById("inboundItemName")
        .innerText=item.name;

    document.getElementById("inboundRack")
        .innerText=item.rack;

    let plan=0;
    let actual=actualData[code] || 0;

    if(inboundData[code]){
        plan=inboundData[code].qty;
    }

    document.getElementById("planQty").innerText=plan;
    document.getElementById("actualQty").innerText=actual;
    document.getElementById("remainQty").innerText=
        plan-actual;
}  
function showMode(mode){

    document.getElementById("rackBtn")
        .classList.remove("modeActive");

    document.getElementById("inboundBtn")
        .classList.remove("modeActive");

    if(mode==="rack"){

        document.getElementById("rackMode")
            .style.display="block";

        document.getElementById("inboundMode")
            .style.display="none";

        document.getElementById("rackBtn")
            .classList.add("modeActive");

    }else{

        document.getElementById("rackMode")
            .style.display="none";

        document.getElementById("inboundMode")
            .style.display="block";

        document.getElementById("inboundBtn")
            .classList.add("modeActive");
    }

    localStorage.setItem("dpsMode",mode);
}

showMode(
    localStorage.getItem("dpsMode") || "rack"
);

renderInboundList();
    
 
</script>
</body>
</html>
